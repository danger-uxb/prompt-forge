  const withE=draft.cast.map((s,i)=>i).filter(i=>sval(S(i),'subj_expr')), noE=draft.cast.map((s,i)=>i).filter(i=>!sval(S(i),'subj_expr'));
  if(withE.length&&noE.length)
    out.push({t:'warn',m:noE.map(L).join(', ')+' <b>'+(noE.length>1?'have':'has')+' no expression</b> while '+withE.map(L).join(', ')+(withE.length>1?' have':' has')+' one. An expression can carry across: a woman smiled in all three test renders when only the miniature she held was asked to, and giving her her own (\u201Ccalm, neutral expression, lips closed\u201D) kept her neutral in both retests. Give every figure its own.'});
  /* 2.2: build that cannot ride in the handle (round 2, i08) */
  const longB=draft.cast.map((s,i)=>i).filter(i=>sval(S(i),'subj_build')&&!buildAdj(S(i))&&!(S(i).handle||'').trim());
  if(longB.length)
    out.push({t:'warn',m:longB.map(L).join(', ')+': <b>the build is too long to go into the handle.</b> In testing, builds rendered only when they were carried in the handle. Rewrite it as a few adjectives (\u201Ctall and athletic\u201D), or type a handle that includes it.'});
  for(let i=1;i<n;i++){
    const s=S(i);
    if(!groupKeys('wardrobe').some(k=>sval(s,k))&&!sval(s,'lock')&&!sval(s,'rstyle'))
      out.push({t:'warn',m:L(i)+' <b>has no wardrobe.</b> The model will dress them by averaging, often in a copy of another figure\u2019s outfit. Give them their own, or state what matches under Render style & scale.'});
  }
  const placed=draft.cast.map((s,i)=>i).filter(i=>posOf(S(i)));
  if(placed.length&&placed.length<n)
    out.push({t:'warn',m:'<b>Some figures are placed and some are not</b> \u2014 unplaced: '+draft.cast.map((s,i)=>i).filter(i=>!posOf(S(i))).map(L).join(', ')+'. An unplaced figure lands wherever the model likes, usually crowding the placed ones.'});
  for(let a=0;a<placed.length;a++) for(let b=a+1;b<placed.length;b++){
    const p=posOf(S(placed[a])), q=posOf(S(placed[b]));
    if(hband(p.x)[1]===hband(q.x)[1]&&dband(p.d)[1]===dband(q.d)[1])
      out.push({t:'warn',m:L(placed[a])+' and '+L(placed[b])+' <b>are in the same spot</b> ('+esc(posPhrase(p))+'). The position text will be identical for both; move one.'});
  }
  if(n>=3&&!draft.staging.headcount)
    out.push({t:'warn',m:'<b>Headcount assertion is off</b> with '+NUMW[n]+' figures. In testing it made the difference at six in a row (seven figures without it, six with); stating the count and naming each figure is the best available guard, though not a guarantee.'});
  /* 2.2: layouts and phrases (R2-02, R2-10) */
  const st=draft.staging, pre=ARRANGEMENTS.find(a=>a.id===st.arr), ph=stagingPhrase();
  if(pre&&pre.risk&&(pre.id!=='line'||placed.length===n))
    out.push({t:'warn',m:'<b>'+esc(pre.label)+':</b> '+esc(pre.risk)});
  else if(ph&&SHAPE_PHRASE.test(ph))
    out.push({t:'warn',m:'<b>The arrangement phrase names a group shape</b> (\u201C'+esc(ph)+'\u201D). Every wedge, circle and two-row phrase tested added a figure on at least one render \u2014 stating the count in the phrase did not help \u2014 while the same positions without a phrase kept the count. Consider clearing it and letting the positions carry the layout.'});
  if(placed.length===n&&n>=2&&!(pre&&pre.risk)){
    const bands=DBANDS.map(b=>placed.filter(i=>dband(posOf(S(i)).d)===b).length);
    if(bands.filter(Boolean).length===3)
      out.push({t:'warn',m:'<b>The figures stand at three depths.</b> Only one step of depth has rendered in testing \u2014 a figure in front of the rest works; longer recessions came out with only the last figure set back.'});
    else if(bands.filter(c=>c>=2).length>=2)
      out.push({t:'warn',m:'<b>Two rows of figures.</b> Second rows collapsed into one row in every test render, and at six figures an extra figure appeared.'});
  }
  if(listVals('bg_fg').concat(listVals('bg_mid'),listVals('bg_back'),listVals('bg_elements')).some(x=>STANDABLE.test(x)))
    out.push({t:'warn',m:'<b>A prop that can be stood on, with several figures.</b> In all five test renders with a plinth sharing a depth plane with a figure, someone stood on it or another object was stacked on it; describing it as \u201Cstanding on its own, its top surface bare\u201D made no difference. What worked was moving it: with the figures in one plane and the prop in a plane that holds none of them, nobody stood on it in either test render. Put it in an empty plane, or leave it out.'});
  return out;
}

/* ============================ derive: checks ============================ */
function checks(){
  const out=[];
  const turbo=(draft.mode||'turbo')==='turbo';
  const cov=coverage();
  const req=requiredAxes();
  const missing=req.filter(([id])=>!cov.has(id));
  if(req.length<AXES.length)
    out.push({t:'ok',m:'<b>Panel mode:</b> framing and pose are carried by the cell descriptions, so the global blocks for those are meant to stay empty. Filling them applies one statement to every cell and flattens the variation.'});
  if(missing.length>3) out.push({t:'warn',m:'<b>'+missing.length+' of '+req.length+' axes are empty.</b> Unfilled axes get a mode-average guess from the sampler: '+missing.map(m=>axisLabel(m[0],m[1])).join(', ')+'.'});
  else if(missing.length) out.push({t:'warn',m:'<b>Still open:</b> '+missing.map(m=>axisLabel(m[0],m[1])).join(', ')+'.'});
  else out.push({t:'ok',m:'<b>All '+req.length+' axes covered.</b>'});

  const hits=annotationHits();
  if(hits.length){
    const sev=plainBackdrop();
    out.push({t:'warn',m:'<b>'+hits.length+' value'+(hits.length===1?'':'s')+' shaped like on-image annotation</b> \u2014 '+
      hits.slice(0,3).map(esc).join(', ')+(hits.length>3?'\u2026':'')+'. '+
      (sev?'The backdrop is plain, which makes this the high-risk case: a centred subject on empty ground reads as an advertisement layout, and the model completes it with a headline drawn from whatever label-shaped strings it can find.'
          :'Lower risk with a busy frame, but still worth rewriting.')+
      ' <button class="btn sm" style="margin-top:7px" onclick="prosifyAll()">Rewrite as prose</button>'});
  }
  if(captionRisk())
    out.push({t:'warn',m:'<b>Caption risk.</b> A plain backdrop, a centred subject and a wide crop leave an empty band the model reads as a headline slot \u2014 it will fill it with text pulled from your key names and values. Saying positively what occupies the backdrop is what stops this; the framing instruction that is supposed to close the gap gets ignored. '+
      '<button class="btn sm" style="margin-top:7px" onclick="insertBackdropGuard()">Add backdrop statement</button>'});
  contradictions().forEach(m=>out.push({t:'warn',m:m}));
  impliedExtraPeople().forEach(x=>out.push({t:'warn',m:'<b>"'+esc(x.phrase)+'"</b>'+(castN()>1?' in '+esc(x.who):'')+' implies people beyond the '+(castN()>1?NUMW[castN()]+' figures':'subject')+' described, and the model may draw them \u2014 \u201Chugging the person next to them\u201D once produced three figures from two, though a retest kept two. Name who the figure relates to instead \u2014 an interaction row in Staging does this \u2014 and keep the headcount assertion on.'}));
  const nh=negationHits();
  if(nh.length){
    const hard=nh.filter(x=>x.hard);
    out.push({t:'warn',m:'<b>Negation in the positive prompt</b> \u2014 '+nh.slice(0,3).map(x=>esc(x.phrase)).join(', ')+(nh.length>3?'\u2026':'')+
      '. There is no subtraction operator in the text encoder, so the negated word is simply conditioning. '+
      (hard.length?'"'+esc(hard[0].phrase)+'" is the dangerous kind: "'+esc(hard[0].noun)+'" is a concrete object and will likely be drawn. Name the empty state positively instead \u2014 "bareheaded" rather than "no hat".'
                  :'No concrete object is being negated here, which is the survivable case, but a positive phrasing is still safer.')});
  }
  panelConflicts().forEach(m=>out.push({t:'warn',m:m}));
  if(turbo&&chipVals('neg').length)
    out.push({t:'warn',m:'You have negatives selected but the mode is Turbo, so they are not emitted and would be ignored anyway. Move what matters into assertions.'});
  if(turbo&&!chipVals('assert').length)
    out.push({t:'warn',m:'No assertions listed. On a distilled model these do the job a negative prompt cannot. They can also be folded into the descriptive fields instead \u2014 "all fingers cleanly separated and fully visible" inside the pose block does the same work \u2014 so treat this as a prompt to check rather than a fault.'});
  if(!turbo&&!chipVals('neg').length)
    out.push({t:'warn',m:'No negative prompt, and the mode is Standard where one would actually be used.'});

  draft.cast.forEach((s,i)=>{
    const pre=castN()>1?'<b>'+esc(subjLabel(i))+':</b> ':'';
    /* a figure rendered in another style (example 01's Pixar miniature) is not a
       photographic human, so the adult-age guard does not apply to it */
    const rendered=sval(s,'rstyle')&&!/^same style/i.test(sval(s,'rstyle'));
    if(sval(s,'subj_type')&&!sval(s,'subj_age')&&!rendered&&HUMAN_RE.test(sval(s,'subj_type')))
      out.push({t:'warn',m:pre+'A human subject with no stated age band. Name one explicitly \u2014 it is the most common cause of an unusable render.'});
    if((sval(s,'ward_top_over')&&!sval(s,'ward_top_base'))||(sval(s,'ward_bottom_over')&&!sval(s,'ward_bottom_base')))
      out.push({t:'warn',m:pre+'An over layer is named with nothing under it. With no base layer to separate from, the outer garment usually renders as a single closed piece.'});
  });
  multiChecks().forEach(c=>out.push(c));
  if(draft.enabled.text&&val('txt_content').length>18)
    out.push({t:'warn',m:'Rendered text is '+val('txt_content').length+' characters. Short strings hold together far better \u2014 "BLU RIDE" is 8.'});
  if(draft.enabled.panels&&!listVals('panel_list').length)
    out.push({t:'warn',m:'Multi-panel is on but no panel is described. Without per-cell descriptions the grid usually collapses into near-identical crops.'});
  if(!val('summary'))
    out.push({t:'warn',m:'No one-sentence anchor. The structured keys refine composition; the sentence sets it.'});
  return out;
}
function axisLabel(id,l){ return (id==='negative'&&(draft.mode||'turbo')==='turbo')?'Assertions':l; }

function latentSize(){
  const a=val('aspect'); if(!a) return null;
  const m=a.match(/(\d+)\s*:\s*(\d+)/); if(!m) return null;
  const r=(+m[1])/(+m[2]);
  const round64=n=>Math.max(512,Math.round(n/64)*64);
  const mk=area=>{const w=round64(Math.sqrt(area*r)),h=round64(Math.sqrt(area/r));return {w,h,mp:(w*h/1048576).toFixed(2)};};
  return [mk(1048576),mk(1572864)];
}

/* ==================== visual reference diagrams ====================
   Inline SVG only — no raster assets, so the file stays single-file and
   works from file://. Each diagram shows the geometry of an option rather
   than one arbitrary photographic example of it. */
let _dgId=0;
const DG_INK='#34475A', DG_BRASS='#A8772C', DG_LINE='#D8DFE6', DG_FAINT='#8A95A3';

function dgSvg(vb,inner,h){
  return '<svg viewBox="'+vb+'" width="100%" height="'+h+'" style="display:block">'+inner+'</svg>';
}
/* abstract standing figure inside a 100 x 140 box, feet at y=128 */
function dgFigure(fill){
  const f=fill||DG_INK;
  return '<circle cx="50" cy="17" r="11" fill="'+f+'"/>'+
    '<rect x="38" y="30" width="24" height="46" rx="8" fill="'+f+'"/>'+
    '<rect x="28" y="33" width="9" height="40" rx="4.5" fill="'+f+'"/>'+
    '<rect x="63" y="33" width="9" height="40" rx="4.5" fill="'+f+'"/>'+
    '<rect x="40" y="74" width="8.5" height="54" rx="4" fill="'+f+'"/>'+
    '<rect x="51.5" y="74" width="8.5" height="54" rx="4" fill="'+f+'"/>';
}
function dgFigureAt(scale,cx,baseY,fill){
  const tx=cx-50*scale, ty=baseY-128*scale;
  return '<g transform="translate('+tx.toFixed(1)+','+ty.toFixed(1)+') scale('+scale+')">'+dgFigure(fill)+'</g>';
}

/* ---- framing: a crop window over a fixed figure ---- */
function dgFraming(crop,scale){
  const id='cf'+(++_dgId);
  const fig = scale? dgFigureAt(scale,50,128) : dgFigure();
  return dgSvg('0 0 100 140',
    '<rect x="0" y="0" width="100" height="140" fill="#F6F8FA"/>'+
    '<g opacity=".16">'+fig+'</g>'+
    '<clipPath id="'+id+'"><rect x="'+crop.x+'" y="'+crop.y+'" width="'+crop.w+'" height="'+crop.h+'"/></clipPath>'+
    '<g clip-path="url(#'+id+')">'+fig+'</g>'+
    '<rect x="'+crop.x+'" y="'+crop.y+'" width="'+crop.w+'" height="'+crop.h+'" fill="none" stroke="'+DG_BRASS+'" stroke-width="1.8"/>',
    124);
}

/* ---- camera angle: side elevation, camera position + sight line ---- */
function dgCamIcon(x,y,rot){
  return '<g transform="translate('+x+','+y+') rotate('+rot+')">'+
    '<rect x="-7" y="-5" width="12" height="10" rx="2" fill="'+DG_BRASS+'"/>'+
    '<path d="M5,-3 L11,-6 L11,6 L5,3 Z" fill="'+DG_BRASS+'"/></g>';
}
function dgAngle(camX,camY,rot,targetY){

    '<rect x="0" y="0" width="130" height="110" fill="#F6F8FA"/>'+
    '<line x1="0" y1="100" x2="130" y2="100" stroke="'+DG_LINE+'" stroke-width="1.5"/>'+

}
/* frame-view variant for angles that are not a camera height */
function dgAngleFrame(inner){

}

/* ---- subject placement: rule-of-thirds grid ---- */
function dgPlace(cx,baseY,scale,extra){

/* ---- depth of field / aperture: real blur via feGaussianBlur ---- */
function dgBlur(bgBlur,bokehR,fgBlur,label){

/* ---- lens: field-of-view cone ---- */
function dgLens(fovDeg,subjScale){
  const half=fovDeg/2*Math.PI/180, L=118;
  const dy=Math.tan(half)*L;
  const y1=(52-dy), y2=(52+dy);

    '<clipPath id="'+id+'"><rect x="1" y="1" width="148" height="102"/></clipPath>'+
    '<rect x="0" y="0" width="150" height="104" fill="#F6F8FA"/>'+

      '<path d="M14,52 L'+(14+L)+','+y1.toFixed(1)+' L'+(14+L)+','+y2.toFixed(1)+' Z" fill="'+DG_BRASS+'" opacity=".13"/>'+
      '<path d="M14,52 L'+(14+L)+','+y1.toFixed(1)+' M14,52 L'+(14+L)+','+y2.toFixed(1)+'" stroke="'+DG_BRASS+'" stroke-width="1.2" fill="none"/>'+
      dgFigureAt(subjScale,104,100)+
    '</g>'+
    dgCamIcon(14,52,0)+
    '<rect x="0.75" y="0.75" width="148.5" height="102.5" fill="none" stroke="'+DG_INK+'" stroke-width="1.4"/>',

/* face-shape distortion at three focal lengths */
function dgFace(noseR,earOff,cheek){

/* ---- aspect ratio: equal-area rectangles ---- */
function dgAspect(w,h){
  const area=5600, k=Math.sqrt(area/(w*h)), W=w*k, H=h*k;
  const x=(150-W)/2, y=(110-H)/2;
  return dgSvg('0 0 150 110',
    '<rect x="0" y="0" width="150" height="110" fill="#F6F8FA"/>'+
    '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+W.toFixed(1)+'" height="'+H.toFixed(1)+'" fill="'+DG_BRASS+'" opacity=".18"/>'+
    '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+W.toFixed(1)+'" height="'+H.toFixed(1)+'" fill="none" stroke="'+DG_BRASS+'" stroke-width="1.6"/>',
    110);
}

/* ==================== staging: arrangements and the stage canvas ====================
   Positions are stored as x (0 = frame left, 1 = frame right) and d (0 = nearest
   the camera, 1 = furthest). The canvas draws them on a floor seen from behind
   and above the camera, so the bottom edge is nearest the lens. A preset only
   writes positions; dragging edits them. Neither guarantees placement in the
   render — finding #11: placement instructions are weakly followed. */
const SPREAD_IDX={1:[3],2:[2,4],3:[2,3,4],4:[1,2,4,5],5:[1,2,3,4,5],6:[0,1,2,4,5,6]};
function spreadX(n,d){ return (SPREAD_IDX[n]||[]).map(k=>({x:+((k+.5)/7).toFixed(3),d})); }
function ringPos(n){
  return Array.from({length:n},(_,i)=>{ const a=Math.PI/2+2*Math.PI*i/n;
    return {x:+(.5+.3*Math.cos(a)).toFixed(3),d:+(.5-.34*Math.sin(a)).toFixed(3)}; });
}
const ARRANGEMENTS=[
  {id:'row',label:'Side by side',min:2,max:6,phrase:'standing side by side in a row',pos:n=>spreadX(n,.36)},
  {id:'facing',label:'Facing each other',min:2,max:2,phrase:'facing each other',pos:()=>[{x:.36,d:.42},{x:.64,d:.42}]},
  {id:'lead',label:'One in front, rest behind',min:2,max:6,phrase:'arranged with one figure in front and the others behind',pos:n=>[{x:.5,d:.16}].concat(spreadX(n-1,.66))},
  {id:'rows',label:'Front row and back row',min:4,max:6,phrase:'in two rows, front and back',risk:'Unreliable. Six figures in two rows came out as one row of seven in every render (7 of 7, with this phrase, a counted phrase or no phrase at all); four in two rows also rendered as one row.',pos:n=>{ const f=Math.ceil(n/2); return spreadX(f,.24).concat(spreadX(n-f,.62)); }},
  {id:'wedge',label:'Wedge, leader at the point',min:3,max:6,phrase:'',posOnly:'Positions only. The wedge phrase added a figure in 2 of 3 renders; the same positions without it kept the count in 2 of 2.',pos:n=>{ const o=[{x:.5,d:.14}]; for(let k=1;k<n;k++){ const r=Math.ceil(k/2), side=k%2?-1:1; o.push({x:+(.5+side*.15*r).toFixed(3),d:+(.14+.2*r).toFixed(3)}); } return o; }},
  {id:'circle',label:'Loose circle',min:3,max:6,phrase:'',posOnly:'Positions only. The circle phrase added one or two figures in 3 of 3 renders, and so did a phrase that stated the count (2 of 2); positions alone kept the count in 2 of 2. For the inward turn, write it into each pose (\u201Cstanding, facing the centre of the circle\u201D) \u2014 that held in testing.',pos:n=>ringPos(n)},
  {id:'table',label:'Around a table',min:2,max:6,phrase:'seated around a table',pos:n=>ringPos(n)},
  /* 2.1: diagonal, so each figure gets distinct words — three depth bands alone cannot separate four or more */
  {id:'line',label:'Diagonal line receding',min:2,max:6,phrase:'in a diagonal line receding from the camera, one behind another',risk:'Only one step of depth renders: in testing only the last figure stepped back and the others stood level.',pos:n=>spreadX(n,0).map((p,i)=>({x:p.x,d:+(.12+.76*i/Math.max(1,n-1)).toFixed(3)}))},
  {id:'scatter',label:'Spread through the scene',min:2,max:6,phrase:'',posOnly:'Positions only. The phrase added a figure once in 3 renders.',risk:'The depths barely render \u2014 the spread comes out as a flat row (round 2: 6 of 6; round 3: 3 of 4). The order across the frame does hold now that the figures are written in the order they stand (round 3: 4 of 4).',pos:n=>{ const xs=[.26,.7,.44,.84,.14,.58], ds=[.2,.34,.62,.76,.5,.88]; return Array.from({length:n},(_,i)=>({x:xs[i],d:ds[i]})); }},
  {id:'free',label:'Free placement',min:2,max:6,phrase:'',pos:null}
];
function defaultPos(i){ return spreadX(castN(),.36)[i]||{x:.5,d:.5}; }

/* small fixed-size thumbnail: viewBox equals rendered size (style guide §7) */
function arrMini(a,n,W,H){
  W=W||96; H=H||60;
  const g={nearY:H-7,farY:12,nearHW:W/2-5,farHW:W*.27};
  const pr=(x,d)=>{ const y=g.nearY-(g.nearY-g.farY)*d, hw=g.nearHW+(g.farHW-g.nearHW)*d; return {cx:W/2+(x-.5)*2*hw,y}; };
  const pts=a.pos?a.pos(n):spreadX(n,.36);
  const floor=[pr(0,0),pr(1,0),pr(1,1),pr(0,1)].map(p=>p.cx.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  let tbl='';
  if(a.id==='table'){ const c=pr(.5,.5), hw=g.nearHW+(g.farHW-g.nearHW)*.5; tbl='<ellipse cx="'+c.cx.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" rx="'+(hw*.36).toFixed(1)+'" ry="'+((g.nearY-g.farY)*.16).toFixed(1)+'" fill="#E7ECF1" stroke="'+DG_LINE+'"/>'; }
  const dots=pts.slice().sort((p,q)=>q.d-p.d).map(p=>{ const c=pr(p.x,p.d); const r=4.6-1.8*p.d;
    return '<circle cx="'+c.cx.toFixed(1)+'" cy="'+(c.y-r).toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+DG_INK+'"/>'; }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" style="display:block">'+
    '<polygon points="'+floor+'" fill="#F6F8FA" stroke="'+DG_LINE+'"/>'+tbl+dots+'</svg>';
}
DIAGRAMS.staging={title:'Staging arrangements',blurb:'The group layouts offered in Staging, drawn as a floor seen from behind the camera \u2014 the bottom edge is nearest the lens. Each preset writes a starting position for every figure; the figures can then be dragged. Rendered in three test rounds: rows, pairs, one-in-front and around-a-table hold the count; wedge, circle and spread now emit positions only, because their phrases added figures; two rows is unreliable. Whatever the diagram shows, only one step of depth renders and the group sits centred in the frame.',
  items:ARRANGEMENTS.filter(a=>a.pos).map(a=>{ const n=Math.max(a.min,Math.min(4,a.max));
    return [a.label, (a.phrase?'\u201C'+a.phrase+'\u201D':'positions only')+' \u00B7 '+a.min+(a.max>a.min?'\u2013'+a.max:'')+' figures'+(a.risk?' \u00B7 '+a.risk.split('.')[0].toLowerCase():''), ()=>arrMini(a,n,150,96)]; })};

function stageGeom(W){ const H=232; return {W,H,nearY:H-24,farY:76,nearHW:W/2-18,farHW:W*.27,nearS:.78,farS:.44}; }
function stageProject(g,x,d){ const y=g.nearY-(g.nearY-g.farY)*d, hw=g.nearHW+(g.farHW-g.nearHW)*d; return {cx:g.W/2+(x-.5)*2*hw,y,s:g.nearS+(g.farS-g.nearS)*d}; }
function stageUnproject(g,cx,y){
  let d=(g.nearY-y)/(g.nearY-g.farY); d=Math.max(0,Math.min(1,d));
  const hw=g.nearHW+(g.farHW-g.nearHW)*d;
  let x=(cx-g.W/2)/(2*hw)+.5; x=Math.max(0,Math.min(1,x));
  return {x,d};
}
function stageInner(g){
  const P0=(x,d)=>stageProject(g,x,d);
  const pt=p=>p.cx.toFixed(1)+','+p.y.toFixed(1);
  let h='<polygon points="'+[P0(0,0),P0(1,0),P0(1,1),P0(0,1)].map(pt).join(' ')+'" fill="#F6F8FA" stroke="'+DG_LINE+'" stroke-width="1.5"/>';
  [1,2,3,4,5,6].map(k=>k/7).forEach(x=>{ const a=P0(x,0), b=P0(x,1); h+='<line x1="'+a.cx.toFixed(1)+'" y1="'+a.y.toFixed(1)+'" x2="'+b.cx.toFixed(1)+'" y2="'+b.y.toFixed(1)+'" stroke="#D8DFE6" stroke-dasharray="3 4"/>'; });
  [.34,.67].forEach(d=>{ const a=P0(0,d), b=P0(1,d); h+='<line x1="'+a.cx.toFixed(1)+'" y1="'+a.y.toFixed(1)+'" x2="'+b.cx.toFixed(1)+'" y2="'+b.y.toFixed(1)+'" stroke="#D8DFE6" stroke-dasharray="3 4"/>'; });
  [['foreground',.12],['midground',.5],['background',.84]].forEach(([t,d])=>{ const a=P0(0,d); h+='<text x="'+(a.cx+8).toFixed(1)+'" y="'+(a.y+4).toFixed(1)+'" font-size="12" fill="'+DG_FAINT+'" font-family="system-ui,sans-serif">'+t+'</text>'; });
  const figs=draft.cast.map((s,i)=>({s,i,p:posOf(s)||defaultPos(i),placed:!!posOf(s)}));
  let tbl='';
  if(draft.staging.arr==='table'){ const c=P0(.5,.5), hw=g.nearHW+(g.farHW-g.nearHW)*.5; tbl='<ellipse cx="'+c.cx.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" rx="'+(hw*.36).toFixed(1)+'" ry="'+((g.nearY-g.farY)*.17).toFixed(1)+'" fill="#E7ECF1" stroke="'+DG_LINE+'" stroke-width="1.5"/>'; }
  const drawFig=o=>{
    const pr=stageProject(g,o.p.x,o.p.d), sc=pr.s;
    const fill=o.i===activeSubj?DG_BRASS:DG_INK;
    const lab=(o.i+1)+' '+(subjLabel(o.i).split(/\s+/)[0]||'').slice(0,12);
    return '<g data-sid="'+o.s.id+'" style="cursor:grab" opacity="'+(o.placed?1:.35)+'">'+
      '<rect x="'+(pr.cx-36*sc).toFixed(1)+'" y="'+(pr.y-128*sc).toFixed(1)+'" width="'+(72*sc).toFixed(1)+'" height="'+(128*sc+16).toFixed(1)+'" fill="transparent"/>'+
      dgFigureAt(+sc.toFixed(3),pr.cx,pr.y,fill)+
      '<text x="'+pr.cx.toFixed(1)+'" y="'+(pr.y+14).toFixed(1)+'" font-size="12" text-anchor="middle" fill="'+(o.i===activeSubj?DG_BRASS:DG_INK)+'" font-family="system-ui,sans-serif" font-weight="600">'+esc(lab)+'</text></g>';
  };
  const far=figs.filter(o=>o.p.d>.5).sort((a,b)=>b.p.d-a.p.d), near=figs.filter(o=>o.p.d<=.5).sort((a,b)=>b.p.d-a.p.d);
  return h+far.map(drawFig).join('')+tbl+near.map(drawFig).join('');
}
let stageDrag=null, stageRaf=false;
function drawStage(){
  const host=$('#stageCanvas'); if(!host) return;
  const W=Math.max(320,Math.round(host.clientWidth||640)), g=stageGeom(W);
  host.innerHTML='<svg id="stageSvg" viewBox="0 0 '+W+' '+g.H+'" width="'+W+'" height="'+g.H+'" style="display:block;touch-action:none"><g id="stageG">'+stageInner(g)+'</g></svg>';
  const svg=$('#stageSvg');
  const at=e=>{ const m=svg.getScreenCTM(); return new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse()); };
  svg.addEventListener('pointerdown',e=>{
    const t=e.target.closest('[data-sid]'); if(!t) return;
    const i=draft.cast.findIndex(s=>s.id===t.dataset.sid); if(i<0) return;
    const p=at(e), cur=posOf(S(i))||defaultPos(i), pr=stageProject(g,cur.x,cur.d);
    stageDrag={id:t.dataset.sid,i,ox:p.x-pr.cx,oy:p.y-pr.y,moved:false};
    svg.setPointerCapture(e.pointerId); e.preventDefault();
  });
  svg.addEventListener('pointermove',e=>{
    if(!stageDrag) return;
    const p=at(e), q=stageUnproject(g,p.x-stageDrag.ox,p.y-stageDrag.oy);
    stageDrag.moved=true;
    draft.staging.pos[stageDrag.id]={x:+q.x.toFixed(3),d:+q.d.toFixed(3)};
    $('#stageG').innerHTML=stageInner(g);
    if(!stageRaf){ stageRaf=true; requestAnimationFrame(()=>{ stageRaf=false; refreshOut(); updatePosList(); }); }
  });
  const end=()=>{
    if(!stageDrag) return;
    const d=stageDrag; stageDrag=null;
    if(!d.moved){ if(d.i!==activeSubj){ activeSubj=d.i; render(); } }
    else { refreshOut(); updatePosList(); }
  };
  svg.addEventListener('pointerup',end);
  svg.addEventListener('pointercancel',end);
}
function posListHTML(){
  return draft.cast.map((s,i)=>'<div>'+(i+1)+' \u00B7 '+esc(subjLabel(i))+'</div><div>'+
    (posOf(s)?esc(posPhrase(posOf(s))):'<span style="color:var(--faint)">not placed \u2014 drag it, or pick an arrangement</span>')+'</div>').join('');
}
function updatePosList(){ const el=$('#posList'); if(el) el.innerHTML=posListHTML(); }
function applyArrangement(id){
  const a=ARRANGEMENTS.find(x=>x.id===id); if(!a) return;
  const st=draft.staging;
  if(a.pos){ const pts=a.pos(castN()); draft.cast.forEach((s,i)=>{ st.pos[s.id]=pts[i]; }); }
  else if(!draft.cast.some(s=>posOf(s))){ const pts=spreadX(castN(),.36); draft.cast.forEach((s,i)=>{ st.pos[s.id]=pts[i]; }); }
  st.arr=id; st.phrase='';
  render();
}
function clearPositions(){ draft.staging.pos={}; draft.staging.arr=''; render(); }
function addRel(){ const c=draft.cast; draft.staging.rel.push({a:c[0].id,rel:'',b:c[1]?c[1].id:''}); render(); }
function delRel(i){ draft.staging.rel.splice(i,1); render(); }
function setOutShape(s){ draft.outShape=s; refreshOut(); }

function icon(d){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"/></svg>';}
function renderNav(){
  $('#nav').innerHTML=NAV.map(([id,label,d])=>'<button class="'+(id===view?'on':'')+'" onclick="go(\''+id+'\')">'+icon(d)+'<span>'+label+'</span></button>').join('');
  $('#railver').innerHTML='<b>v'+APP_VERSION+'</b> · '+APP_BUILD;
  renderLockbox();
}
function go(v){ view=v; render(); window.scrollTo(0,0); }

/* ============================ render router ============================ */
function render(){
  renderNav();
  $('#main').innerHTML =
      view==='builder' ? viewBuilder()
    : view==='library' ? viewLibrary()
    : view==='parts'   ? viewParts()
    : view==='examples'? viewExamples()
    : view==='guide'   ? viewGuide()
    : view==='ref'     ? viewRef()
    :                    viewData();
  if(view==='builder') wireBuilder();
  if(view==='parts') wireParts();
}

/* ---------------- Builder ---------------- */
/* `sub` is a cast index for per-figure fields (bound with data-sk to the
   active subject), or undefined for shot-level fields in draft.f (data-k). */
function fieldHTML(f,sub){
  const isS=sub!=null;
  const v=isS?(S(sub).f[f.k]||''):(draft.f[f.k]||'');
  const bind=isS?'data-sk="'+f.k+'"':'data-k="'+f.k+'"';
  const hint=f.hint?'<div class="qhint">'+esc(f.hint)+'</div>':'';
  const dlink=f.d?'<button type="button" class="dlink" onclick="openDiagram(\''+f.d+'\')">see diagrams</button>':'';
  let ctl='';
  if(f.t==='textarea') ctl='<textarea '+bind+' rows="2">'+esc(v)+'</textarea>';
  else if(f.t==='list') ctl='<textarea '+bind+' rows="4" placeholder="one per line">'+esc(v)+'</textarea>';
  else if(f.t==='chips'&&!isS){
    const sel=chipVals(f.k);
    ctl='<div class="chiprow">'+f.o.map(o=>'<button type="button" class="chip '+(sel.includes(o)?'on':'')+'" data-chip="'+f.k+'" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+
        '</div><input style="margin-top:8px" placeholder="add your own, then press Enter" data-chipadd="'+f.k+'">';
  }
  else if(f.t==='colors'&&!isS){
    const sel=chipVals(f.k);
    ctl='<div class="swatchrow">'+sel.map(c=>'<button type="button" class="sw" style="background:'+esc(c)+'" title="'+esc(c)+' — click to remove" data-swdel="'+f.k+'" data-v="'+esc(c)+'"></button>').join('')+
        '<input type="color" style="width:44px;height:28px;padding:2px" data-swpick="'+f.k+'" value="#2E4A7D">'+
        '<button type="button" class="btn sm" data-swadd="'+f.k+'">Add</button></div>'+
        (sel.length?'<div class="qhint" style="margin-top:6px">'+sel.map(esc).join(' · ')+'</div>':'');
  }
  else {
    const dl=f.o?' list="dl_'+f.k+'"':'';
    ctl='<input '+bind+dl+' value="'+esc(v)+'" placeholder="type freely, or pick a starting point">'+
        (f.o?'<datalist id="dl_'+f.k+'">'+f.o.map(o=>'<option value="'+esc(o)+'">').join('')+'</datalist>':'');
  }
  return '<label class="fld">'+esc(f.q)+dlink+'</label>'+hint+ctl;
}

/* Insert / Save-as-part controls. Insert stays clickable when there is
   nothing to insert and says why (blocked-button convention). */
function partBtns(type){
  const n=db.parts.filter(p=>p.type===type).length;
  return '<span class="partbtns" onclick="event.stopPropagation()">'+
    '<button type="button" class="pbtn'+(n?'':' blocked')+'" onclick="openInsertPart(\''+type+'\')">Insert'+(n?' <span class="num">'+n+'</span>':'')+'</button>'+
    '<button type="button" class="pbtn" onclick="openSavePart(\''+type+'\')">Save as part</button></span>';

function castBody(){
  const n=castN();
  if(activeSubj>=n) activeSubj=n-1;
  const s=S(activeSubj), dh=derivedHandles();
  const tabs='<div class="ctabs">'+draft.cast.map((q,i)=>
      '<button type="button" class="ctab '+(i===activeSubj?'on':'')+'" onclick="setActiveSubj('+i+')"><span class="cnum num">'+(i+1)+'</span><span id="ctabl'+i+'">'+esc(subjLabel(i))+'</span></button>').join('')+
    (n<MAX_CAST?'<button type="button" class="ctab add" onclick="addSubject()">+ Add subject</button>':'<span class="qhint" style="align-self:center;margin:0">Six is the maximum.</span>')+'</div>';
  const meta='<div class="inline2">'+
      '<div><label class="fld">Name <span class="qhint" style="font-weight:400">\u2014 for you only, never emitted</span></label>'+
      '<input data-smeta="name" value="'+esc(s.name)+'" placeholder="e.g. Andreja"></div>'+
      '<div><label class="fld">In-prompt handle</label>'+
      '<input id="handleIn" data-smeta="handle" value="'+esc(s.handle)+'" placeholder="'+esc(dh[activeSubj])+'"></div></div>'+
    '<div class="qhint" style="margin-top:5px">The handle is how the prompt names this figure when others are in frame \u2014 in the headcount, the left-to-right order and the interactions. Leave it blank to use the derived one shown: it carries the colour of the upper garment and a short build, plus the fewest other traits needed to tell the figures apart. In testing, colour in the handle kept shirts on the right bodies at five and six figures, and builds rendered only when they were in the handle. A typed handle is used exactly as written.</div>';
  const tools='<div class="subjtools">'+
    (activeSubj>0?'<button type="button" class="btn sm ghost" onclick="moveSubject(-1)">\u2190 Move left</button>':'')+
    (activeSubj<n-1?'<button type="button" class="btn sm ghost" onclick="moveSubject(1)">Move right \u2192</button>':'')+
    (n<MAX_CAST?'<button type="button" class="btn sm ghost" onclick="dupSubject()">Duplicate</button>':'')+
    (n>1?'<button type="button" class="btn sm danger" onclick="removeSubject()">Remove</button>':'')+
    (n===2?'<span class="qhint" style="align-self:center;margin:0 0 0 4px">Order matters for the classic two-figure shape: the first is <span class="num">subject</span>, the second <span class="num">second_subject</span>.</span>':'')+
    '</div>';
  const groups=SUBJ_GROUPS.map(g=>{
    const cnt=g.fields.filter(f=>sval(s,f.k)).length;
    const open=openGroups.has(g.id);
    return '<div class="sgrp '+(open?'open':'')+'"><div class="sgrphead" onclick="toggleGroup(\''+g.id+'\')">'+
      '<span class="caret">\u25B6</span><b>'+esc(g.title)+'</b>'+(cnt?'<span class="tag">'+cnt+'</span>':'')+
      (g.part?partBtns(g.part):'')+'</div>'+
      '<div class="sgrpbody">'+(g.hint?'<div class="qhint" style="margin-top:10px">'+esc(g.hint)+'</div>':'')+
      (open?g.fields.map(f=>fieldHTML(f,activeSubj)).join(''):'')+'</div></div>';
  }).join('');
  return tabs+'<div class="subjcard">'+meta+tools+groups+'</div>';
}

const REL_OPTS=['stands behind','stands beside','stands in front of','stands shoulder to shoulder with','faces','looks at','looks past','has an arm around the shoulders of','holds the hand of','hands something to','kneels beside','sits beside','leans against','argues with','shields','stands back to back with','shakes hands with'];

    '<div class="arrrow">'+arrs.map(a=>'<button type="button" class="arrchip '+(st.arr===a.id?'on':'')+'" onclick="applyArrangement(\''+a.id+'\')">'+arrMini(a,n)+'<span>'+esc(a.label)+'</span></button>').join('')+'</div>'+
    (preset&&(preset.posOnly||preset.risk)?'<div class="qhint" style="margin-top:6px">'+(preset.risk?'<span style="color:var(--warn)">'+esc(preset.risk)+'</span> ':'')+esc(preset.posOnly||'')+'</div>':'')+
    '<label class="fld">Stage <span class="qhint" style="font-weight:400">\u2014 drag figures; click one to edit it</span></label>'+
    '<div id="stageCanvas" class="stagebox"></div>'+
    '<div class="qhint" style="margin-top:6px">The floor as seen from behind the camera: the bottom edge is nearest the lens. Positions are emitted as plain words (\u201Cleft of centre, in the foreground\u201D), never as numbers. They are a request rather than a guarantee \u2014 placement instructions are a weak lever (finding #11). In testing the order across the frame and one step of depth (a figure in front of the rest) rendered; deeper recessions and second rows collapsed, the group always sat centred, and <i>far left</i> / <i>far right</i> were never reached.</div>'+
    '<div class="kv" id="posList" style="margin-top:10px">'+posListHTML()+'</div>'+
    '<div style="margin-top:8px"><button type="button" class="btn sm ghost" onclick="clearPositions()">Clear positions</button></div>'+
    '<label class="fld">Arrangement phrase</label>'+
    '<div class="qhint">Edit to override the preset wording. Blank uses the preset\u2019s phrase shown as the placeholder.</div>'+
    '<input data-stp="1" value="'+esc(st.phrase||'')+'" placeholder="'+esc(preset&&preset.phrase?preset.phrase:(preset&&preset.posOnly?'positions only \u2014 leave blank':'e.g. gathered around the open hatch'))+'">'+
    '<div class="checkline"><input id="st_hc" type="checkbox" data-sthc="1" '+(st.headcount?'checked':'')+'><label for="st_hc" style="margin:0;font-size:13px;color:var(--ink)">Assert the headcount and name every figure</label></div>'+
    '<div class="qhint" style="margin-top:4px">On Turbo this joins the assertions; on Standard it goes in the staging block. In testing it held the count for rows of one to six; it made the difference at six in a row, and it did not stop the extra figure in wedge, circle or two-row layouts.</div>'+
    '<label class="fld">Interactions</label>'+
    '<div class="qhint">One row per relationship, written out with both handles \u2014 never \u201Cthe person next to them\u201D, which has added a third figure (finding #7, though not in its round-1 retest). Leave the second figure blank for an action with no target. Each row is also written into the acting figure\u2019s own pose (\u201Cstands behind\u201D becomes \u201Cstanding behind \u2026\u201D): an interaction that lived only in its row was dropped in testing. Two-person actions render reliably; an arm around the shoulders tends to come out as a hand on the shoulder.</div>'+
    rels+'<datalist id="dl_rel">'+REL_OPTS.map(o=>'<option value="'+esc(o)+'">').join('')+'</datalist>'+
    '<div style="margin-top:8px"><button type="button" class="btn sm" onclick="addRel()">+ Add interaction</button></div>'+

function secPartType(secId){
  if(secId==='staging') return 'staging';
  return Object.keys(PART_TYPES).find(k=>PART_TYPES[k].sec===secId)||null;
}
function viewBuilder(){
  const cov=coverage();

    let count, anyFilled, body='';
    if(s.special==='cast'){
      count=castN(); anyFilled=draft.cast.some(q=>SUBJ_KEYS.some(k=>sval(q,k)));

    } else {

      count=flds.filter(f=>val(f.k)).length;

  const arch=Object.entries(ARCHETYPES).map(([k,a])=>'<button type="button" class="chip '+(draft.archetype===k?'on':'')+'" onclick="setArch(\''+k+'\')">'+esc(a.label)+'</button>').join('');

  return '<div class="pagehead"><div><div class="eyebrow">Prompt Forge</div><h1>'+(editingId?'Editing prompt':'New prompt')+'</h1>'+

    '<div style="display:flex;gap:8px"><button class="btn ghost" onclick="resetDraft()">Clear</button>'+
    '<button class="btn brass" onclick="savePrompt()">'+(editingId?'Update':'Save to library')+'</button></div></div>'+

    '<div class="builder"><div>'+
      '<div class="card" style="margin-bottom:14px"><div class="pad">'+
        '<label class="fld" style="margin-top:0">Prompt name</label>'+

        '<label class="fld">Sampler mode</label>'+
        '<div class="qhint">Turbo and other distilled models run at low CFG with no negative text: at CFG 1 the negative is never read, and the Z-Image workflow (run at CFG 1.3 in this project\u2019s tests) feeds it a zeroed-out copy of the positive instead. Either way there is nowhere for negative words to go. This changes what the tool emits, not just what it advises.</div>'+
        '<div class="chiprow">'+

          '<button type="button" class="chip '+(draft.mode==='standard'?'on':'')+'" onclick="setMode(\'standard\')">Standard \u00B7 CFG above 1</button>'+

        '<div class="qhint">Prefills the fields that these shot types always specify. Everything stays editable.</div>'+
        '<div class="chiprow">'+arch+'</div>'+
        '<label class="fld">Reference render (optional)</label>'+
        '<div class="qhint">The actual ComfyUI output this prompt produced &mdash; a documentary record, not sent back to the model. Resized and JPEG-compressed before it touches storage.</div>'+
        '<input id="f_img" type="file" accept="image/*" onchange="onDraftImagePicked(this)">'+
        '<div id="imgPreviewWrap">'+renderDraftImgPreview()+'</div>'+
        '<div class="checkline"><input id="f_protected" type="checkbox" '+(draft.protected?'checked':'')+' onchange="onDraftProtectedToggle(this)"><label for="f_protected" style="margin:0;font-size:13px;color:var(--ink)">Mark as Protected &mdash; encrypts this whole record with a PIN</label></div>'+
      '</div></div>'+

}

function toggleGroup(id){ if(openGroups.has(id)) openGroups.delete(id); else openGroups.add(id); render(); }
function setActiveSubj(i){ activeSubj=i; render(); }
function addSubject(){
  if(castN()>=MAX_CAST) return toast('Six figures is the maximum');
  draft.cast.push(newSubject()); activeSubj=castN()-1;
  if(castN()===2) openSecs.add('staging');
  render(); toast('Subject '+castN()+' added');
}
function dupSubject(){
  if(castN()>=MAX_CAST) return toast('Six figures is the maximum');
  const s=S(activeSubj);
  const c={id:sid(),name:s.name?s.name+' (copy)':'',handle:'',f:JSON.parse(JSON.stringify(s.f))};
  draft.cast.splice(activeSubj+1,0,c); activeSubj++;
  if(castN()===2) openSecs.add('staging');
  render(); toast('Duplicated \u2014 give the copy a trait the original does not have');
}
function removeSubject(){
  if(castN()<2) return;
  const s=S(activeSubj);
  if((s.name||Object.keys(s.f).some(k=>sval(s,k)))&&!confirm('Remove '+subjLabel(activeSubj)+' from the cast?')) return;
  draft.cast.splice(activeSubj,1);
  delete draft.staging.pos[s.id];
  draft.staging.rel=draft.staging.rel.filter(r=>r.a!==s.id&&r.b!==s.id);
  activeSubj=Math.max(0,Math.min(activeSubj,castN()-1));
  render(); toast('Removed');
}
function moveSubject(dir){
  const j=activeSubj+dir; if(j<0||j>=castN()) return;
  const c=draft.cast; [c[activeSubj],c[j]]=[c[j],c[activeSubj]]; activeSubj=j; render();
}

function outputCard(cov){
  const json=buildJSON();
  const neg=buildNegative();
  const text= outTab==='nested'?JSON.stringify(json,null,2)
            : outTab==='flat'  ?JSON.stringify(buildFlat(),null,2)
            :                   buildProse();
  const req=requiredAxes();
  const pct=Math.round(Math.min(cov.size,req.length)/req.length*100);
  const ck=checks();
  const ls=latentSize();
  return '<div class="card">'+
    '<div class="pad" style="padding-bottom:12px">'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline">'+
        '<b style="font-size:13.5px">Axis coverage</b><span class="num" style="font-size:13px">'+cov.size+' / '+AXES.length+'</span></div>'+
      '<div class="meter"><div class="meterfill" style="width:'+pct+'%"></div></div>'+
      '<div class="axisgrid">'+AXES.map(([id,l])=>'<span class="axistag '+(axisNA(id)?'na':(cov.has(id)?'on':''))+'" title="'+(axisNA(id)?'carried by the panel descriptions':'')+'">'+axisLabel(id,l)+'</span>').join('')+'</div>'+
    '</div>'+
    '<div class="pad" style="padding-top:0">'+ck.map(c=>'<div class="note '+(c.t==='ok'?'ok':'')+'">'+c.m+'</div>').join('')+
      (ls?'<div class="note ok" style="background:var(--surface-2);color:var(--muted)"><b>Latent size:</b> set the Empty Latent node to <span class="num">'+ls[0].w+' × '+ls[0].h+'</span> ('+ls[0].mp+' MP) or <span class="num">'+ls[1].w+' × '+ls[1].h+'</span> ('+ls[1].mp+' MP). The aspect field below is documentation only — the prompt text does not set image dimensions. These are generic buckets rounded to /64; I can\u2019t confirm what resolution Z-Image Turbo was actually trained at, so treat them as a starting point.</div>':'')+
    '</div>'+
    '<div class="pad" style="padding-top:0">'+
    (castN()>=2?(()=>{
      const sh=effShape(), n=castN();
      const opt=(k,l)=>'<button type="button" class="chip '+(sh===k?'on':'')+'" onclick="setOutShape(\''+k+'\')">'+l+'</button>';
      const same=' Two test rounds found no visible difference between the three shapes and no key name was ever drawn as text, so the shape is not a lever; array is the default from three figures.';
      const hint=(sh==='classic'?'<span class="num">subject</span> + <span class="num">second_subject</span> \u2014 the shape examples 01 and 05 were rendered with. Figures stay in tab order: the first is the primary subject.'
                : sh==='array'?'A <span class="num">subjects</span> list, one object per figure, written front to back and left to right once everyone is placed.'
                : 'A <span class="num">figures</span> object keyed by position (<span class="num">figure_left</span>, \u2026), in stage order.')+same;
      return '<div class="shaperow"><b>Figures emitted as</b><div class="chiprow">'+(n===2?opt('classic','Classic two-figure'):'')+opt('array','Array')+opt('keyed','Keyed by position')+'</div><div class="qhint" style="margin-top:6px">'+hint+'</div></div>';
    })():'')+
    '</div>'+
    '<div class="tabs">'+
      ['nested','flat','prose'].map(t=>'<button class="'+(outTab===t?'on':'')+'" onclick="setTab(\''+t+'\')">'+(t==='nested'?'Nested JSON':t==='flat'?'Flat JSON':'Natural language')+'</button>').join('')+
    '</div>'+
    '<div style="padding:0 14px 14px"><pre class="out" id="outPre">'+esc(text)+'</pre>'+
      '<div style="display:flex;gap:8px;margin-top:10px">'+
        '<button class="btn brass sm" onclick="copyOut()">Copy</button>'+
        '<button class="btn sm" onclick="downloadOut()">Download</button>'+
      '</div>'+
      (neg
        ? '<div style="margin-top:14px"><b style="font-size:12.5px">Negative conditioning \u2014 separate node</b>'+
          '<div class="qhint">Paste this into the negative CLIP Text Encode node only. Inside the positive blob these words become positive conditioning.</div>'+
          '<pre class="out" id="negPre" style="max-height:120px">'+esc(neg)+'</pre>'+
          '<button class="btn sm" style="margin-top:8px" onclick="copyEl(\'negPre\')">Copy negative</button></div>'
        : '<div class="note ok" style="margin-top:14px;background:var(--surface-2);color:var(--muted)">Turbo mode: no negative block is produced. The distilled workflow either ignores the negative (CFG 1) or zeroes it out (ConditioningZeroOut, as in the Z-Image template), so negative text has nowhere to go \u2014 and becomes live positive text if it ends up in the wrong node.</div>')+
    '</div>'+
  '</div>';
}

function wireBuilder(){
  $$('#main [data-k]').forEach(el=>{
    el.addEventListener('input',e=>{
      const k=e.target.dataset.k;
      if(k==='__name') draft.name=e.target.value; else draft.f[k]=e.target.value;
      refreshOut();
    });
  });
  /* per-figure fields and meta: write to the active subject, refresh only the
     output panel and the few labels that depend on the value (focus kept) */
  const relabel=()=>{
    const t=$('#ctabl'+activeSubj); if(t) t.textContent=subjLabel(activeSubj);
    const h=$('#handleIn'); if(h) h.placeholder=derivedHandles()[activeSubj];
  };
  $$('#main [data-sk]').forEach(el=>{
    el.addEventListener('input',e=>{ S(activeSubj).f[e.target.dataset.sk]=e.target.value; relabel(); refreshOut(); });
  });
  $$('#main [data-smeta]').forEach(el=>{
    el.addEventListener('input',e=>{ S(activeSubj)[e.target.dataset.smeta]=e.target.value; relabel(); refreshOut(); });
  });
  $$('#main [data-stp]').forEach(el=>el.addEventListener('input',e=>{ draft.staging.phrase=e.target.value; refreshOut(); }));
  $$('#main [data-sthc]').forEach(el=>el.addEventListener('change',e=>{ draft.staging.headcount=e.target.checked; refreshOut(); }));
  $$('#main [data-reli]').forEach(el=>{
    const ev=el.tagName==='SELECT'?'change':'input';
    el.addEventListener(ev,e=>{ const r=draft.staging.rel[+e.target.dataset.reli]; if(!r) return; r[e.target.dataset.relk]=e.target.value; refreshOut(); });
  });
  $$('#main [data-sec]').forEach(el=>{
    el.addEventListener('change',e=>{ draft.enabled[e.target.dataset.sec]=e.target.checked;
      if(e.target.checked) openSecs.add(e.target.dataset.sec); render(); });
  });
  $$('#main [data-chip]').forEach(el=>{
    el.addEventListener('click',e=>{
      const k=el.dataset.chip,v=el.dataset.v,cur=chipVals(k);
      const i=cur.indexOf(v); if(i>=0) cur.splice(i,1); else cur.push(v);
      draft.f[k]=cur.join('|'); el.classList.toggle('on'); refreshOut();
    });
  });
  $$('#main [data-chipadd]').forEach(el=>{
    el.addEventListener('keydown',e=>{
      if(e.key!=='Enter') return; e.preventDefault();
      const k=el.dataset.chipadd,v=el.value.trim(); if(!v) return;
      const cur=chipVals(k); if(!cur.includes(v)) cur.push(v);
      draft.f[k]=cur.join('|'); el.value=''; render(); openSecs.add('negative');
    });
  });
  $$('#main [data-swadd]').forEach(el=>{
    el.addEventListener('click',()=>{
      const k=el.dataset.swadd,pick=$('[data-swpick="'+k+'"]');
      const v=pick.value.toUpperCase(),cur=chipVals(k);
      if(!cur.includes(v)) cur.push(v);
      draft.f[k]=cur.join('|'); render();
    });
  });
  $$('#main [data-swdel]').forEach(el=>{
    el.addEventListener('click',()=>{
      const k=el.dataset.swdel,cur=chipVals(k).filter(c=>c!==el.dataset.v);
      draft.f[k]=cur.join('|'); render();
    });
  });
  drawStage();
}
function refreshOut(){
  const host=$('.sticky'); if(!host) return;
  host.innerHTML=outputCard(coverage());
}
function toggleSec(id){
  const s=SECTIONS.find(x=>x.id===id);
  if(!secActive(s)) return;

async function savePrompt(){
  if(!draft.name.trim()){ openSecs.add('intent'); render(); return toast('Give the prompt a name first'); }
  if(draft.protected && !sessionKey) return toast('Unlock protection first');
  const isEdit=!!editingId;   // captured up front — cheap insurance against a later refactor
  const now=todayStr();
  const image=draft.image||null;
  const contentObj={name:draft.name.trim(),archetype:draft.archetype,mode:draft.mode||'turbo',
    enabled:{...draft.enabled},f:{...draft.f},cast:JSON.parse(JSON.stringify(draft.cast)),
    staging:JSON.parse(JSON.stringify(draft.staging)),outShape:draft.outShape||null};
  const id=editingId||uid();
  const i=db.prompts.findIndex(p=>p.id===id);

  if(draft.protected){
    const enc=await encryptJSON(contentObj, sessionKey);
    rec={id, protected:true, enc, updated:now};
    imgOk=image?await idbPut(id, {enc:true, blob:await encryptJSON({data:image.data,w:image.w,h:image.h}, sessionKey)}):await idbDelete(id);
    decryptedCache[id]={...contentObj, image};
  } else {
    rec={id, protected:false, updated:now, ...contentObj};

    else { imgOk=await idbDelete(id); delete imageCache[id]; }
  }
  if(i>=0) db.prompts[i]=rec; else db.prompts.unshift(rec);
  editingId=id;

  render();

}

/* ---------------- Import prompt JSON ----------------
   Reverses buildJSON(): takes a prompt in the tool's own output shape (or a
   hand-edited one following the same key names, like the shipped example
   files) and reconstructs the flat draft.f field map plus enabled/mode.
   Loads into the builder for review rather than saving straight to the
   library, since an externally-authored file may not round-trip perfectly. */
const REV_SUBJ={type:'subj_type',age:'subj_age',aesthetic:'subj_aesthetic',build:'subj_build',hair:'subj_hair',eyes:'subj_eyes',skin:'subj_skin',distinguishing_features:'subj_features',expression:'subj_expr'};
const REV_POSE={body:'pose_body',hands:'pose_hands',gaze:'pose_gaze'};
const REV_COMP={framing:'framing',camera_angle:'angle',subject_placement:'placement',depth_of_field:'dof',focus_priority:'focus',leading_lines:'lines'};
const REV_LIGHT={source:'light_src',quality:'light_qual',direction:'light_dir',shadows:'light_shadow',highlights:'light_hi',separation:'light_sep'};
const REV_COL={color_scheme:'col_scheme',saturation:'col_sat',contrast:'col_contrast',grading:'col_grade'};
const REV_CAM={camera_type:'cam_body',lens:'cam_lens',aperture:'cam_ap',iso:'cam_iso',shutter_speed:'cam_shutter'};
const REV_TXT={text_content:'txt_content',location:'txt_where',font_style:'txt_font',color:'txt_col'};
function applyRevMap(obj,map,f){
  if(!obj||typeof obj!=='object') return;
  for(const k in map){
    const v=obj[k];
    if(v===undefined||v===null||v==='') continue;
    f[map[k]]=Array.isArray(v)?v.join('\n'):String(v);
  }
}
function revLayer(src,baseK,overK,howK,f){
  if(!src) return;
  if(typeof src==='string'){ f[baseK]=src; return; }
  if(src.base_layer) f[baseK]=src.base_layer;
  if(src.over_layer) f[overK]=src.over_layer;
  if(src.layering) f[howK]=src.layering;
}
function revWardrobe(w,f){
  if(!w||typeof w!=='object') return;
  revLayer(w.upper,'ward_top_base','ward_top_over','ward_top_how',f);
  revLayer(w.lower,'ward_bottom_base','ward_bottom_over','ward_bottom_how',f);
  if(w.footwear) f.ward_shoes=w.footwear;
  if(w.outerwear) f.ward_outer=w.outerwear;
  if(w.accessories) f.ward_acc=w.accessories;
}
function revMakeup(m,f){
  if(!m||typeof m!=='object') return;
  if(m.style) f.makeup_style=m.style;
  if(Array.isArray(m.details)) f.makeup_details=m.details.join('\n');
}
/* One figure object (from subjects[], figures{}, subject or second_subject)
   back into a cast member. `who` and `position` are returned separately. */
function revFigure(obj){
  const s=newSubject(), f=s.f;
  if(!obj||typeof obj!=='object') return {s,who:'',pos:null};
  applyRevMap(obj,REV_SUBJ,f);
  if(obj.render_style) f.rstyle=String(obj.render_style);
  if(obj.scale_and_placement) f.scale=String(obj.scale_and_placement);
  const lock=obj.consistency_with_primary||obj.consistency_with; if(lock) f.lock=String(lock);
  revMakeup(obj.makeup,f); revWardrobe(obj.wardrobe,f); applyRevMap(obj.pose,REV_POSE,f);
  return {s,who:typeof obj.who==='string'?obj.who.trim():'',pos:typeof obj.position==='string'?phraseToPos(obj.position):null};
}
function importedJSONtoDraftParts(o){
  const f={}, enabled={};
  if(typeof o.scene_summary==='string') f.summary=o.scene_summary;
  let figs=[], outShape=null;
  if(Array.isArray(o.subjects)){ figs=o.subjects.map(revFigure); outShape='array'; }
  else if(o.figures&&typeof o.figures==='object'){ figs=Object.keys(o.figures).map(k=>revFigure(o.figures[k])); outShape='keyed'; }
  else {
    const p=revFigure(o.subject||{});
    revMakeup(o.makeup,p.s.f); revWardrobe(o.wardrobe,p.s.f); applyRevMap(o.pose,REV_POSE,p.s.f);
    figs=[p];
    if(o.second_subject){ figs.push(revFigure(o.second_subject)); outShape='classic'; }
  }
  figs=figs.slice(0,MAX_CAST);
  const cast=figs.map(x=>x.s);
  if(o.style_separation) f.style_sep=o.style_separation;
  if(o.environment){
    if(o.environment.location) f.loc=o.environment.location;
    if(o.environment.time_of_day) f.time=o.environment.time_of_day;
    if(o.environment.background_distance) f.bg_distance=o.environment.background_distance;
    if(Array.isArray(o.environment.elements)) f.bg_elements=o.environment.elements.join('\n');
    if(Array.isArray(o.environment.foreground)) f.bg_fg=o.environment.foreground.join('\n');
    if(Array.isArray(o.environment.midground)) f.bg_mid=o.environment.midground.join('\n');
    if(Array.isArray(o.environment.background)) f.bg_back=o.environment.background.join('\n');
  }
  applyRevMap(o.composition, REV_COMP, f);
  if(o.panel_layout){
    enabled.panels=true;
    if(o.panel_layout.structure) f.panel_struct=o.panel_layout.structure;
    if(o.panel_layout.dividers) f.panel_div=o.panel_layout.dividers;
    if(o.panel_layout.style) f.panel_style=o.panel_layout.style;
    if(o.panel_layout.panels && typeof o.panel_layout.panels==='object'){
      const lines=[];
      for(const k in o.panel_layout.panels){
        const v=o.panel_layout.panels[k];
        lines.push(/^panel_\d+$/.test(k) ? v : k.replace(/_/g,' ')+': '+v);
      }
      f.panel_list=lines.join('\n');
    }
  }
  applyRevMap(o.lighting, REV_LIGHT, f);
  if(o.color_profile){
    applyRevMap(o.color_profile, REV_COL, f);
    if(Array.isArray(o.color_profile.dominant_colors)) f.col_palette=o.color_profile.dominant_colors.join('|');
  }
  applyRevMap(o.camera, REV_CAM, f);
  if(o.typography){ applyRevMap(o.typography, REV_TXT, f); enabled.text=true; }
  if(o.style){
    if(o.style.genre) f.sty_genre=o.style.genre;
    if(Array.isArray(o.style.style_fusion)) f.sty_fusion=o.style.style_fusion.join('\n');
    if(o.style.detail_level) f.sty_detail=o.style.detail_level;
    if(o.style.mood) f.sty_mood=o.style.mood;
    if(o.style.narrative) f.sty_narr=o.style.narrative;
    if(o.style.image_quality) f.res=o.style.image_quality;
  }
  let asserts=Array.isArray(o.additional_detail)?o.additional_detail.slice():(typeof o.additional_detail==='string'?[o.additional_detail]:[]);
  const HC=/^the frame contains exactly /i;
  const staging=newStaging(false);
  if(asserts.some(a=>HC.test(a))){ staging.headcount=true; asserts=asserts.filter(a=>!HC.test(a)); }
  if(asserts.length) f.assert=asserts.join('|');
  let mode='turbo';
  if(o.negative_prompt){
    mode='standard';
    f.neg=Array.isArray(o.negative_prompt)?o.negative_prompt.join('|'):String(o.negative_prompt).split(/,\s*/).filter(Boolean).join('|');
  }
  if(o.aspect_ratio) f.aspect=o.aspect_ratio;

  /* handles: keep an imported `who` only where it differs from what would be
     derived, so the figure keeps tracking its own traits when edited */
  const saved=draft; draft={...newDraft(),cast,staging};
  const dh=derivedHandles();
  cast.forEach((s,i)=>{ if(figs[i].who&&figs[i].who.toLowerCase()!==dh[i].toLowerCase()) s.handle=figs[i].who; });
  cast.forEach((s,i)=>{ if(figs[i].pos) staging.pos[s.id]=figs[i].pos; });
  const handles=cast.map((s,i)=>handleOf(i).toLowerCase());
  draft=saved;
  const notes=[];
  if(o.staging&&typeof o.staging==='object'){
    const g=o.staging;
    if(g.headcount) staging.headcount=true;
    if(typeof g.arrangement==='string'&&g.arrangement.trim()){
      const a=ARRANGEMENTS.find(x=>x.phrase&&x.phrase.toLowerCase()===g.arrangement.trim().toLowerCase());
      if(a) staging.arr=a.id; else staging.phrase=g.arrangement.trim();
    }
    (Array.isArray(g.interactions)?g.interactions:[]).forEach(t=>{
      const low=String(t).trim().replace(/\.$/,''), lt=low.toLowerCase();
      const ai=handles.findIndex(h=>lt.startsWith(h));
      if(ai<0){ notes.push(low); return; }
      const rest=low.slice(handles[ai].length).trim(), rl=rest.toLowerCase();
      const bi=handles.findIndex((h,j)=>j!==ai&&rl.endsWith(h));
      const rel=bi>=0?rest.slice(0,rest.length-handles[bi].length).trim():rest;
      staging.rel.push({a:cast[ai].id,rel,b:bi>=0?cast[bi].id:''});
    });
    (Array.isArray(g.notes)?g.notes:[]).forEach(t=>notes.push(String(t)));
  }
  if(notes.length) f.stage_notes=notes.join('\n');
  return {f,enabled,mode,cast,staging,outShape};
}
function importPromptJSON(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    let data;
    try{ data=JSON.parse(reader.result); }catch(e){ toast('Not valid JSON'); return; }
    if(typeof data!=='object'||data===null||Array.isArray(data)){ toast('Not a recognisable prompt JSON'); return; }
    const parts=importedJSONtoDraftParts(data);
    if(!Object.keys(parts.f).length&&!parts.cast.some(s=>Object.keys(s.f).length)){ toast('Nothing recognisable in that file'); return; }
    const suggested=(typeof data.scene_summary==='string'&&data.scene_summary.trim())?data.scene_summary.trim().slice(0,70):'Imported prompt';
    const name=(window.prompt('Name this prompt:', suggested)||suggested).trim()||'Imported prompt';
    draft={name, archetype:'blank', mode:parts.mode, enabled:parts.enabled, f:parts.f, cast:parts.cast, staging:parts.staging, outShape:parts.outShape, protected:false, image:null};
    editingId=null; activeSubj=0;
    openSecs=new Set(['intent','cast']);
    if(castN()>1) openSecs.add('staging');
    Object.keys(parts.enabled).forEach(x=>openSecs.add(x));
    view='builder'; render(); window.scrollTo(0,0);
    toast('Imported — review, then Save to library');
  };
  reader.onerror=()=>toast('Could not read that file');
  reader.readAsText(file);
  input.value='';
}

/* ---------------- Parts library ----------------
   A part is one section's (or one figure-group's) answers saved under a name,
   inserted into a prompt as a snapshot copy. Editing a part later changes
   nothing in prompts it was already inserted into. Inserting replaces that
   section's current answers rather than merging, so a part always lands whole.
   Staging parts are templates: slot positions and interactions are stored by
   cast order and apply to any cast of the same size. */
const PART_TYPES={
  character:{label:'Character',scope:'subject',group:'identity'},
  wardrobe:{label:'Wardrobe',scope:'subject',group:'wardrobe'},
  pose:{label:'Pose & action',scope:'subject',group:'pose'},
  staging:{label:'Staging',scope:'staging'},
  scene:{label:'Scene & environment',scope:'section',sec:'scene'},
  composition:{label:'Composition & framing',scope:'section',sec:'composition'},
  panels:{label:'Panel layout',scope:'section',sec:'panels'},
  lighting:{label:'Lighting',scope:'section',sec:'lighting'},
  colour:{label:'Colour',scope:'section',sec:'colour'},
  camera:{label:'Camera & optics',scope:'section',sec:'camera'},
  text:{label:'Text in image',scope:'section',sec:'text'},
  style:{label:'Style & mood',scope:'section',sec:'style'},
  assertions:{label:'Assertions & exclusions',scope:'section',sec:'negative'},
  output:{label:'Output & technical',scope:'section',sec:'output'}
};
function partKeys(type){
  const t=PART_TYPES[type];
  if(t.scope==='subject') return groupKeys(t.group);
  if(t.scope==='section') return SECTIONS.find(s=>s.id===t.sec).fields.map(f=>f.k);
  return SECTIONS.find(s=>s.id==='staging').fields.map(f=>f.k);
}
function collectPart(type){
  const t=PART_TYPES[type], keys=partKeys(type), f={};
  if(t.scope==='subject'){ const s=S(activeSubj); keys.forEach(k=>{ if(sval(s,k)) f[k]=s.f[k]; }); return Object.keys(f).length?{f}:null; }
  if(t.scope==='section'){ keys.forEach(k=>{ if(val(k)) f[k]=draft.f[k]; }); return Object.keys(f).length?{f}:null; }
  const st=draft.staging, ids=draft.cast.map(s=>s.id);
  keys.forEach(k=>{ if(val(k)) f[k]=draft.f[k]; });
  const slots=draft.cast.map(s=>posOf(s)?{...posOf(s)}:null);
  const rel=st.rel.map(r=>({a:ids.indexOf(r.a),rel:r.rel||'',b:ids.indexOf(r.b)})).filter(r=>r.a>=0&&r.rel.trim());
  if(!st.arr&&!(st.phrase||'').trim()&&!slots.some(Boolean)&&!rel.length&&!Object.keys(f).length) return null;
  return {n:castN(),st:{arr:st.arr,phrase:st.phrase||'',headcount:!!st.headcount,slots,rel},f};
}
function partSummary(p){
  if(p.type==='staging'){
    const a=ARRANGEMENTS.find(x=>x.id===(p.st&&p.st.arr));
    return [NUMW[p.n]+' figures',a?a.label:((p.st&&p.st.phrase)||'custom'),((p.st&&p.st.rel)||[]).length+' interaction'+(((p.st&&p.st.rel)||[]).length===1?'':'s')].join(' \u00B7 ');
  }
  return Object.values(p.f||{}).map(v=>String(v).split('\n')[0].split('|')[0]).filter(Boolean).slice(0,3).join(' \u00B7 ').slice(0,120);
}
function targetNote(type){
  const t=PART_TYPES[type];

  if(t.scope==='staging') return 'Replaces the staging. Needs a cast of the same size; slots fill in cast order.';
  return 'Replaces the current '+t.label.toLowerCase()+' answers.';
}

  return list.map(p=>{

      '<button class="btn sm '+(bad?'blocked':'brass')+'" onclick="insertPart(\''+p.id+'\')">Insert</button></div>';
  }).join('');
}
function insertPart(id){
  const p=db.parts.find(x=>x.id===id); if(!p) return;
  if(applyPart(p)){ closeModal(); view='builder'; render(); toast('Inserted \u201C'+p.name+'\u201D'); }
}
function applyPart(p){
  const t=PART_TYPES[p.type], keys=partKeys(p.type), copy=JSON.parse(JSON.stringify(p.f||{}));
  if(t.scope==='subject'){
    const s=S(activeSubj);
    keys.forEach(k=>delete s.f[k]); Object.assign(s.f,copy);
    openGroups.add(t.group); openSecs.add('cast');
    if(p.type==='character'&&!(s.name||'').trim()) s.name=p.name;
    return true;
  }
  if(t.scope==='section'){
    keys.forEach(k=>delete draft.f[k]); Object.assign(draft.f,copy);
    const sec=SECTIONS.find(x=>x.id===t.sec);
    if(sec.toggle) draft.enabled[sec.id]=true;
    openSecs.add(sec.id);
    return true;
  }
  if(p.n!==castN()){ toast('That staging is for '+NUMW[p.n]+' figures; the cast has '+NUMW[castN()]+'. Add or remove figures first.'); return false; }
  const ids=draft.cast.map(s=>s.id), st=draft.staging, src=p.st||{};
  st.arr=src.arr||''; st.phrase=src.phrase||''; st.headcount=!!src.headcount; st.pos={};
  (src.slots||[]).forEach((q,i)=>{ if(q&&ids[i]) st.pos[ids[i]]={x:q.x,d:q.d}; });
  st.rel=(src.rel||[]).filter(r=>ids[r.a]).map(r=>({a:ids[r.a],rel:r.rel,b:r.b>=0&&ids[r.b]?ids[r.b]:''}));
  keys.forEach(k=>delete draft.f[k]); Object.assign(draft.f,copy);
  openSecs.add('staging');
  return true;
}

function exampleDraft(e){
  const d=migrateContent(JSON.parse(JSON.stringify({name:e.title,archetype:'blank',mode:e.mode,enabled:e.enabled||{},f:e.f||{},cast:e.cast,staging:e.staging,outShape:e.outShape===undefined?null:e.outShape})));

}
function withExample(i,fn){

function loadExample(i){

    '<li><b>Slot-fill, don\u2019t describe.</b> A named key is a binding site. "Black one-piece swimsuit with white trim" under <span class="num">clothing</span> cannot bleed onto the hair the way loose prose does.</li>'+
    '<li><b>Concrete nouns over adjectives.</b> "Brown houndstooth newsboy cap" is dense in the training data. "Stylish hat" is not.</li>'+
    '<li><b>Photographic vocabulary is a realism lever.</b> f/8, 24mm, golden hour, ring light reflection in the eyes — these correlate with real photographs far harder than the word "photorealistic" does.</li>'+
    '<li><b>Enumerate the background.</b> Listing elements makes the model place each one. Describing the background makes it invent a generic backdrop.</li>'+

    '<li><b>Carry a plain sentence as well.</b> The sentence sets global composition; the keys refine it. The redundancy is doing real work.</li>'+

  card('Seeing the options',
    '<p class="body">The framing, angle, placement, depth-of-field, lens, aperture and aspect-ratio lists all have diagrams behind them \u2014 open the <b>Visual guide</b> in the sidebar, or use the <i>see diagrams</i> link next to the question itself while building.</p>'+

    '<p class="body"><b>Image dimensions.</b> In ComfyUI the Empty Latent node sets these. An <span class="num">aspect_ratio</span> key in the prompt is documentation for you, not an instruction to the model — the size helper in the builder computes the latent values to type in.</p>'+
    '<p class="body"><b>Sampler settings.</b> CFG, steps, scheduler and seed live in the workflow. The builder has a free-text field to record which combination worked, so a saved prompt stays reproducible months later.</p>'+
    '<p class="body">The test renders behind this app\u2019s findings ran at CFG 1.3, 8 steps, res_multistep / simple, AuraFlow shift 3, with a zeroed negative \u2014 CFG 1 gave poorer output in that workflow.</p>'+
    '<p class="body" style="color:var(--warn)">I have not independently verified Z-Image Turbo\u2019s native training resolution, so the suggested latent sizes are generic /64 buckets rather than model-specific advice.</p>')+
  '</div>'+

  '<h2>Multi-figure findings and open problems</h2>'+
  '<div class="grid cols-2">'+
  card('Multi-figure scenes \u2014 what two test rounds showed',

    '<div class="kv" style="margin-top:10px">'+
    '<div>Headcount</div><div>Held in rows, pairs and around a table at one to six figures. The assertion mattered only at six in a row. Wedge, circle and two-row layouts added a figure \u2014 always a copy or a split of an existing one \u2014 until their phrases were removed; two rows still fails.</div>'+
    '<div>Order</div><div>Position words beat list order at two figures and lose at three, where attributes split between the two. Figures are now written in the order they stand.</div>'+

    '<p class="body">Staging gives spatial relations a home. What the model follows is narrower than what the stage can express.</p>'+
    '<div class="kv" style="margin-top:10px">'+
    '<div>Spatial relations</div><div>The order across the frame renders whenever the figures are written in the order they stand, and so does one step of depth \u2014 a figure in front of the rest. Longer recessions and second rows collapse, the group always sits centred with margins, and far left and far right are never reached.</div>'+
    '<div>Depth planes</div><div>Separate foreground, midground and background lists kept objects apart where one flat list clustered them or dropped one. With several figures, a standable prop gets stood on or stacked \u2014 unless it sits in a plane holding no figure.</div>'+
    '<div>Lighting</div><div>\u201CShadowless\u201D leaves soft floor shadows, and a positive statement about the floor changed nothing on its own. Naming large lighting equipment draws it into the frame.</div>'+
    '<div>Weak levers</div><div>How much of the frame the subject fills is poorly followed \u2014 an explicit \u201Cfilling the frame from top to bottom\u201D instruction was ignored outright and the figures rendered at roughly 60% of frame height.</div>'+
    '<div>Asymmetric panels</div><div>Layouts beyond an even grid are unproven. The one tall panel plus two stacked arrangement has not been rendered and may simplify back into thirds.</div>'+
    '</div>')+
  '</div>';
}

}

/* ---------- Gzip backup ---------- */
function supportsGzipStreams(){ return typeof CompressionStream!=='undefined'&&typeof DecompressionStream!=='undefined'; }
function gzipStringToBlob(str){
  const bytes=new TextEncoder().encode(str);
  const cs=new CompressionStream('gzip'); const w=cs.writable.getWriter();
  w.write(bytes); w.close();
  return new Response(cs.readable).blob();
}
function triggerDownload(blob,filename){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=filename; a.click(); URL.revokeObjectURL(a.href);
}
function downloadJSONBackup(obj,base){
  const json=JSON.stringify(obj,null,2);
  if(supportsGzipStreams()) gzipStringToBlob(json).then(b=>triggerDownload(b,base+'.json.gz'));
  else triggerDownload(new Blob([json],{type:'application/json'}),base+'.json');
}
function readBackupFileAsText(file){
  return file.arrayBuffer().then(buf=>{
    const bytes=new Uint8Array(buf);
    const isGzip=bytes.length>2&&bytes[0]===0x1f&&bytes[1]===0x8b;
    if(isGzip&&supportsGzipStreams()){
      const ds=new DecompressionStream('gzip'); const w=ds.writable.getWriter();
      w.write(bytes); w.close();
      return new Response(ds.readable).blob().then(b=>b.text());
    }
    return new Blob([bytes]).text();
  });
}
function gzipStringToBytes(str){
  const bytes=new TextEncoder().encode(str);
  const cs=new CompressionStream('gzip'); const w=cs.writable.getWriter();
  w.write(bytes); w.close();
  return new Response(cs.readable).arrayBuffer().then(buf=>new Uint8Array(buf));
}
function gunzipBytesToText(bytes){
  const ds=new DecompressionStream('gzip'); const w=ds.writable.getWriter();
  w.write(bytes); w.close();
  return new Response(ds.readable).blob().then(b=>b.text());
}
async function exportJSON(){
  const backup=await buildBackupObject();
  downloadJSONBackup(backup,'prompt-forge-'+todayStr());
  toast('Backup exported');
}

/* Encrypts the ENTIRE database (not just Protected prompts) with the same
   PIN-derived key used for Protected content. The exported file is a small
   JSON wrapper holding the salt/iterations (not secret — needed to re-derive
   the key from the PIN on import) plus one AES-GCM ciphertext of the
   gzip-compressed database. Requires the app to be unlocked (or a PIN to be
   created first) since the same key is reused. */
async function exportEncryptedJSON(){
  if(!sessionKey){
    if(!db.security){ openPinSetupModal(()=>exportEncryptedJSON()); return; }
    openPinUnlockModal(()=>exportEncryptedJSON()); return;
  }
  const backup=await buildBackupObject();
  const json=JSON.stringify(backup);
  let payloadBytes, gz;
  if(supportsGzipStreams()){ payloadBytes=await gzipStringToBytes(json); gz=true; }
  else { payloadBytes=new TextEncoder().encode(json); gz=false; }
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, sessionKey, payloadBytes);
  const wrapper={
    promptForgeEncryptedBackup:1,
    salt: db.security.salt,
    iterations: db.security.iterations,
    gz,
    iv: buf2b64(iv),
    ct: buf2b64(ct)
  };
  downloadJSONBackup(wrapper, 'prompt-forge-encrypted-'+todayStr());
  toast('Encrypted backup exported');
}

function importJSON(input){
  const f=input.files[0]; if(!f) return;
  readBackupFileAsText(f).then(async text=>{
    let data;
    try{ data=JSON.parse(text); }catch(e){ toast('Not a valid backup file'); input.value=''; return; }
    if(data && data.promptForgeEncryptedBackup){
      pendingEncryptedImport=data; input.value=''; openImportPinModal(); return;
    }
    try{
      if(!Array.isArray(data.prompts)) throw 0;
      /* Capture the images map before migrateDB, which strips backupVersion-only
         fields (including .images) from the object it's handed. */
      const importedImages=data.images;
      db=migrateDB(data); sessionKey=null; decryptedCache={}; editingId=null;
      const imgOk=await applyImportedImages(importedImages);
      const ok=saveDB() && imgOk;
      render();
      if(ok) toast('Backup imported'+(db.security?' — unlock again to view protected prompts':''));
    }catch(e){ toast('Not a valid backup file'); }
    input.value='';
  });
}
async function resetAll(){
  if(!confirm('Replace all stored prompts and parts with the built-in demo data?')) return;
  db=migrateDB(structuredClone(SEED)); sessionKey=null; decryptedCache={}; editingId=null;
  await idbClear(); await loadImageCache();
  const ok=saveDB();
  render();
  if(ok) toast('Reset to demo data');
}

/* ============================ PIN modals ============================ */
function cancelPinFlow(){ pinAfterFn=null; closeModal(); render(); }
function openPinSetupModal(afterFn){
  pinAfterFn=afterFn||null;
  $('#modalRoot').innerHTML='<div class="scrim" onclick="if(event.target===this)cancelPinFlow()">'+
    '<div class="modal"><div class="mh"><h3>Set a PIN</h3><button class="iconbtn" onclick="cancelPinFlow()">✕</button></div>'+
    '<div class="sub" style="margin:0 0 4px">This PIN encrypts your protected prompts. There\u2019s no recovery if you forget it — the content is encrypted, not just hidden.</div>'+
    '<label class="fld">New PIN</label><input id="pin1" type="password" autocomplete="off">'+
    '<label class="fld">Confirm PIN</label><input id="pin2" type="password" autocomplete="off" onkeydown="if(event.key===\'Enter\')confirmPinSetup()">'+
    '<div class="foot"><button class="btn ghost" onclick="cancelPinFlow()">Cancel</button><button class="btn brass" onclick="confirmPinSetup()">Set PIN</button></div>'+
    '</div></div>';
  setTimeout(()=>$('#pin1')&&$('#pin1').focus(),30);
}
async function confirmPinSetup(){
  const a=$('#pin1').value, b=$('#pin2').value;
  if(a.length<4) return toast('PIN must be at least 4 characters');
  if(a!==b) return toast('PINs don\u2019t match');
  const ok=await setupPin(a);
  if(ok) toast('PIN set — unlocked for this session');
  /* 1.x left this dialog open when a follow-on action was queued (the
     Protected checkbox, encrypted export). Close first; a follow-on that
     needs its own dialog simply opens it. */
  const fn=pinAfterFn; pinAfterFn=null;
  closeModal(); render(); if(fn) fn();
}
function openPinUnlockModal(afterFn){
  pinAfterFn=afterFn||null;
  $('#modalRoot').innerHTML='<div class="scrim" onclick="if(event.target===this)cancelPinFlow()">'+
    '<div class="modal"><div class="mh"><h3>Unlock protected prompts</h3><button class="iconbtn" onclick="cancelPinFlow()">✕</button></div>'+
    '<label class="fld">PIN</label><input id="pinu" type="password" autocomplete="off" onkeydown="if(event.key===\'Enter\')confirmPinUnlock()">'+
    '<div class="foot"><button class="btn ghost" onclick="cancelPinFlow()">Cancel</button><button class="btn brass" onclick="confirmPinUnlock()">Unlock</button></div>'+
    '</div></div>';
  setTimeout(()=>$('#pinu')&&$('#pinu').focus(),30);
}
async function confirmPinUnlock(){
  const pin=$('#pinu').value;
  const ok=await tryUnlock(pin);
  if(!ok) return toast('Incorrect PIN');
  toast('Unlocked');
  const fn=pinAfterFn; pinAfterFn=null;
  closeModal(); render(); if(fn) fn();
}
function openPinChangeModal(){
  $('#modalRoot').innerHTML='<div class="scrim" onclick="if(event.target===this)closeModal()">'+
    '<div class="modal"><div class="mh"><h3>Change PIN</h3><button class="iconbtn" onclick="closeModal()">✕</button></div>'+
    '<label class="fld">New PIN</label><input id="cpin1" type="password" autocomplete="off">'+
    '<label class="fld">Confirm new PIN</label><input id="cpin2" type="password" autocomplete="off" onkeydown="if(event.key===\'Enter\')confirmPinChange()">'+
    '<div class="foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn brass" onclick="confirmPinChange()">Change PIN</button></div>'+
    '</div></div>';
  setTimeout(()=>$('#cpin1')&&$('#cpin1').focus(),30);
}
async function confirmPinChange(){
  const a=$('#cpin1').value, b=$('#cpin2').value;
  if(a.length<4) return toast('PIN must be at least 4 characters');
  if(a!==b) return toast('PINs don\u2019t match');
  const ok=await changePin(a);
  closeModal(); render();
  if(ok) toast('PIN changed');
}
function openImportPinModal(){
  $('#modalRoot').innerHTML='<div class="scrim" onclick="if(event.target===this)cancelImportPin()">'+
    '<div class="modal"><div class="mh"><h3>Enter PIN to import</h3><button class="iconbtn" onclick="cancelImportPin()">✕</button></div>'+
    '<div class="sub" style="margin:0 0 4px">This backup is fully encrypted. Enter the PIN it was exported with.</div>'+
    '<label class="fld">PIN</label><input id="pinimp" type="password" autocomplete="off" onkeydown="if(event.key===\'Enter\')confirmImportPin()">'+
    '<div class="foot"><button class="btn ghost" onclick="cancelImportPin()">Cancel</button><button class="btn brass" onclick="confirmImportPin()">Import</button></div>'+
    '</div></div>';
  setTimeout(()=>$('#pinimp')&&$('#pinimp').focus(),30);
}
function cancelImportPin(){ pendingEncryptedImport=null; closeModal(); }
async function confirmImportPin(){
  const pin=$('#pinimp').value;
  const wrap=pendingEncryptedImport;
  if(!wrap) return closeModal();
  try{
    const key=await deriveKey(pin, wrap.salt, wrap.iterations);
    const iv=new Uint8Array(b642buf(wrap.iv));
    const plainBuf=await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, b642buf(wrap.ct));
    const bytes=new Uint8Array(plainBuf);
    const jsonText=(wrap.gz && supportsGzipStreams()) ? await gunzipBytesToText(bytes) : new TextDecoder().decode(bytes);
    const data=JSON.parse(jsonText);
    if(!Array.isArray(data.prompts)) throw new Error('unexpected shape');
    /* Capture before migrateDB, which strips backupVersion-only fields
       (including .images) from the object it's handed. */
    const importedImages=data.images;
    db=migrateDB(data);
    /* Populate the image store before decrypting protected prompts below —
       decryptPromptWithImage fetches each one's (already-encrypted) image
       record from the store, so the store has to be filled first. */
    const imgOk=await applyImportedImages(importedImages);
    sessionKey=key; decryptedCache={};
    for(const p of db.prompts){
      if(p.protected && p.enc){ try{ decryptedCache[p.id]=await decryptPromptWithImage(p, key); }catch(e){} }
    }
    editingId=null; pendingEncryptedImport=null;
    const ok=saveDB() && imgOk;
    closeModal(); render();
    if(ok) toast('Encrypted backup imported and unlocked');
  }catch(e){
    toast('Incorrect PIN, or the file is corrupted');
  }
}

/* ============================ boot ============================ */
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
let _rsT; window.addEventListener('resize',()=>{ clearTimeout(_rsT); _rsT=setTimeout(()=>{ if(view==='builder') drawStage(); },180); });
/* Images must be in the in-memory cache before the first render, or every
   card with a saved render flashes its empty "no render" state on load. */
async function boot(){
  idb=await openImageDB();
  if(!idb) setStorageAlert('Image store unavailable — reference images cannot be loaded or saved in this browser.');
  await migrateInlineImages();
  await loadImageCache();
  render();
}
boot();
