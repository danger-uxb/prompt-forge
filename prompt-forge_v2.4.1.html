<!-- ============================================================
     PROMPT FORGE — Ink & Brass single-file tool
     Question-driven builder for structured JSON image prompts
     (Z-Image / ComfyUI). Offline-first: no fonts, no CDNs, no build.
     State = a list of saved prompt records + a library of reusable parts
     (character identity, wardrobe, pose, staging template, and one type per
     shot-level section), inserted into prompts as snapshot copies.
     2.0: a prompt holds a cast of up to six figures, each with its own
     identity/wardrobe/pose, plus a Staging block (preset or dragged stage
     positions, named interactions, headcount assertion). One figure emits
     exactly the 1.x JSON; two default to the rendered subject+second_subject
     shape; array and keyed-by-position shapes are offered but untested.
     All output (JSON, natural language, coverage) is DERIVED at render time.
     Saved prompts may carry a reference render image (client-side resized
     JPEG) and may be flagged Protected: the whole record (name, archetype,
     mode, enabled sections, field answers, image) is then AES-GCM encrypted
     in place, key derived from a PIN via PBKDF2-SHA256, matching the scheme
     used in Prompt Vault. The PIN unlocks all Protected prompts for the
     browser session; nothing about a locked prompt is ever written to
     storage in the clear. gzip-compressed JSON export/import is the normal
     backup; a separate fully-encrypted backup (same PIN) is also offered.
     ============================================================ -->

<style>
:root{
  --ink:#16202B;--ink-2:#243240;
  --paper:#EAEEF2;--surface:#FFFFFF;--surface-2:#F6F8FA;
  --muted:#5A6675;--faint:#8A95A3;
  --line:#D8DFE6;--line-2:#E7ECF1;
  --brass:#A8772C;--brass-hi:#C8943A;--brass-soft:#F3EAD8;
  --gain:#1B7A4B;--gain-soft:#E4F1EA;--loss:#B5403A;--loss-soft:#F6E6E5;
  --warn:#8A6414;--warn-soft:#F2E7CC;
  --r:7px;--r-lg:11px;
  --shadow:0 1px 2px rgba(22,32,43,.06),0 6px 20px rgba(22,32,43,.05);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Consolas,monospace;
  --eyebrow-size:13px;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);font-size:14px;line-height:1.45;color:var(--ink);
  background:var(--paper);-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
a{color:var(--brass)}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.rail{background:var(--ink);color:#C9D3DD;padding:20px 14px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:6px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin:-16px 0 14px -14px}
.brand .seal{width:56px;height:56px;flex:none;display:block}
.brand b{color:#fff;font-size:14px;font-weight:650;letter-spacing:.02em;white-space:nowrap}
.brand small{display:block;color:var(--faint);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:#AEBAC6;padding:9px 11px;border-radius:var(--r);font-size:13.5px;text-align:left;cursor:pointer;width:100%}
.nav button:hover{background:rgba(255,255,255,.05)}
.nav button.on{background:rgba(200,148,58,.14);color:#fff}
.nav button.on .ic{color:var(--brass-hi)}
.nav .ic{width:17px;height:17px;color:#8595A4;flex:none}
.railver{font-size:10.5px;color:var(--faint);letter-spacing:.04em;padding:12px 8px 0}
.railver b{color:#9FB0C0;font-weight:600}
.lockbox{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;margin:0 0 4px;
  background:rgba(255,255,255,.05);border-radius:var(--r);font-size:11.5px}
.lockbox .st{color:#C9D3DD;font-weight:600}
.lockbox button{border:0;background:none;color:var(--brass-hi);font-size:11.5px;font-weight:600;cursor:pointer;padding:0}
.main{padding:26px 30px 60px;max-width:1320px}

/* ---- type / page header ---- */
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.eyebrow{font-size:var(--eyebrow-size);letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:700;margin-bottom:7px}
h1{margin:0;font-size:22px;font-weight:680;letter-spacing:-.02em}
h2{font-size:15px;font-weight:650;margin:26px 0 10px}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
p.body{color:var(--muted);font-size:13.5px;max-width:78ch}

/* ---- grids ---- */
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:repeat(3,1fr)}
.builder{display:grid;grid-template-columns:1fr 430px;gap:18px;align-items:start}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.cardhead{display:flex;justify-content:space-between;align-items:center;padding:14px 17px;border-bottom:1px solid var(--line)}
.cardhead h3{margin:0;font-size:14px;font-weight:650}
.cardhead .hint{font-size:12px;color:var(--faint)}
.pad{padding:16px 17px}
.sticky{position:sticky;top:20px}

.hero{background:linear-gradient(160deg,var(--ink),#1d2c3a);color:#fff;border:0;padding:22px 24px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(200,148,58,.22);box-shadow:0 0 0 18px rgba(200,148,58,.05)}
.hero .k{color:#9FB0C0;font-size:12px}
.hero .v{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.hero .rule{width:46px;height:2px;background:var(--brass-hi);margin:11px 0 0}
.hero .meta{color:#9FB0C0;font-size:12.5px;margin-top:12px}

/* ---- pills / buttons / chips ---- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;font-family:var(--mono)}
.pill.up{background:var(--gain-soft);color:var(--gain)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.down{background:var(--loss-soft);color:var(--loss)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:8px 14px;font-size:13.5px;font-weight:550;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.brass{background:var(--brass);color:#fff;border-color:var(--brass)}
.btn.brass:hover{background:#946826}
.btn.ghost{background:none}
.btn.danger{color:var(--loss);border-color:var(--loss-soft)}
.btn.danger:hover{background:var(--loss-soft)}
.btn.blocked{opacity:.55}
.btn.blocked:hover{opacity:.75;background:var(--surface)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.iconbtn{border:0;background:none;color:var(--faint);cursor:pointer;padding:4px;border-radius:5px;font-size:15px;line-height:1}
.iconbtn:hover{background:var(--loss-soft);color:var(--loss)}

/* ---- table ---- */
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
thead th{background:var(--ink);color:#fff;font-weight:600;text-align:left;padding:9px 14px;font-size:12px}
thead th:first-child{border-top-left-radius:var(--r-lg)}
thead th:last-child{border-top-right-radius:var(--r-lg)}
tbody td{padding:9px 14px;border-bottom:1px solid var(--line-2);overflow:hidden;text-overflow:ellipsis}
tbody tr:nth-child(even){background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr.row-active{background:var(--brass-soft);box-shadow:inset 3px 0 0 var(--brass)}
tbody tr.row-warn{background:var(--warn-soft)}
tbody tr.row-muted{background:rgba(22,32,43,.06);color:var(--muted)}
.r{text-align:right}

/* ---- inputs ---- */
label.fld{display:block;font-size:12.5px;color:var(--ink);font-weight:600;margin:14px 0 3px}
.qhint{font-size:11.5px;color:var(--faint);margin-bottom:5px;line-height:1.35}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;font-family:var(--sans);background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:58px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brass-soft);border-color:var(--brass)}
.inline2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* ---- section accordion ---- */
.sec{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.sechead{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;background:var(--surface)}
.sechead:hover{background:var(--surface-2)}
.sechead .caret{color:var(--faint);font-size:11px;width:12px;transition:transform .15s}
.sec.open .sechead .caret{transform:rotate(90deg)}
.sechead b{font-size:13.5px;font-weight:650;flex:1}
.secbody{padding:2px 16px 18px;border-top:1px solid var(--line-2);display:none}
.sec.open .secbody{display:block}
.sec.off .sechead b{color:var(--faint)}
.axisdot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.axisdot.filled{background:var(--brass)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}

/* ---- output ---- */
pre.out{background:#101A24;color:#D6E0EA;border-radius:var(--r);padding:14px;font-family:var(--mono);font-size:11.8px;
  line-height:1.5;max-height:56vh;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0}
pre.out .k{color:var(--brass-hi)}
.tabs{display:flex;gap:4px;padding:10px 14px 0}
.tabs button{border:1px solid var(--line);border-bottom:0;background:var(--surface-2);color:var(--muted);
  border-radius:var(--r) var(--r) 0 0;padding:6px 12px;font-size:12.5px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.meter{height:8px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-2);overflow:hidden;margin-top:8px}
.meterfill{height:100%;background:var(--brass)}
.axisgrid{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.axistag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--faint);background:#fff}
.axistag.on{background:var(--brass-soft);border-color:var(--brass-soft);color:var(--brass)}
.axistag.na{background:var(--surface-2);border-style:dashed;color:var(--faint);text-decoration:line-through}
.note{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:9px 12px;font-size:12.5px;margin-bottom:8px}
.note.ok{background:var(--gain-soft);color:var(--gain)}
.note b{font-weight:700}

/* ---- misc ---- */
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.tag{display:inline-block;background:var(--surface-2);border:1px solid var(--line-2);border-radius:5px;padding:1px 8px;font-size:12px;color:var(--muted)}
.swatchrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.sw{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);cursor:pointer}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.checkline{display:flex;align-items:center;gap:8px;margin-top:14px}
.checkline input{width:auto}
.thumb{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block}
.thumb-empty{width:52px;height:52px;border-radius:6px;background:var(--surface-2);border:1px dashed var(--line);
  display:grid;place-items:center;color:var(--faint);font-size:10px;text-align:center}
.imgprev{max-width:220px;border-radius:var(--r);border:1px solid var(--line);display:block;margin-top:8px}
.pill.protected{background:var(--warn-soft);color:var(--warn)}

/* ---- toast / modal ---- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:9px;z-index:60;pointer-events:none;transition:.18s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brass-hi)}
.savealert{position:fixed;left:0;right:0;top:0;z-index:120;background:var(--loss);color:#fff;
  padding:10px 18px;font-size:13px;font-weight:600;line-height:1.4;text-align:center;
  box-shadow:0 2px 12px rgba(22,32,43,.3)}
.savealert[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(16,22,30,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(560px,96vw);box-shadow:0 20px 60px rgba(16,22,30,.3);padding:20px 22px;max-height:90vh;overflow:auto}
.modal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.modal .mh h3{margin:0;font-size:16px}
.modal .foot{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.modal.wide{width:min(1000px,96vw)}

/* ---- diagram grid ---- */
.exrow{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
.eximg{width:100%;border-radius:var(--r);border:1px solid var(--line);display:block}
@media(max-width:820px){.exrow{grid-template-columns:1fr}}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px}
.dcell{border:1px solid var(--line-2);border-radius:var(--r);padding:9px;background:var(--surface-2)}
.dcell svg{border-radius:4px;background:#fff}
.dcell b{display:block;font-size:12.5px;font-weight:650;margin-top:8px}
.dcell span{display:block;font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.dlink{border:0;background:none;color:var(--brass);font-size:11.5px;font-weight:600;
  cursor:pointer;padding:0 0 0 9px;text-decoration:underline}
.dlink:hover{color:var(--brass-hi)}

/* ---- cast, staging and parts (2.0) ---- */
.ctabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.ctab{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:6px 11px;font-size:12.5px;cursor:pointer;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.ctab:hover{background:var(--surface-2)}
.ctab .cnum{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);font-size:11px;flex:none}
.ctab.on{background:var(--brass-soft);border-color:var(--brass);box-shadow:inset 3px 0 0 var(--brass)}
.ctab.on .cnum{background:var(--brass);color:#fff;border-color:var(--brass)}
.ctab.add{border-style:dashed;color:var(--muted)}
.subjcard{border-top:1px solid var(--line-2);margin-top:10px;padding-top:2px}
.subjtools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.sgrp{border:1px solid var(--line-2);border-radius:var(--r);margin-top:10px;background:var(--surface)}
.sgrphead{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer}
.sgrphead:hover{background:var(--surface-2)}
.sgrphead b{font-size:13px;font-weight:650;flex:1}
.sgrphead .caret{color:var(--faint);font-size:10px;width:10px;transition:transform .15s}
.sgrp.open .sgrphead .caret{transform:rotate(90deg)}
.sgrpbody{display:none;padding:0 12px 14px;border-top:1px solid var(--line-2)}
.sgrp.open .sgrpbody{display:block}
.partbtns{display:inline-flex;gap:5px;flex:none}
.pbtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:3px 9px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.pbtn:hover{background:var(--brass-soft);border-color:var(--brass)}
.pbtn.blocked{opacity:.55}
.pbtn .num{font-size:11px;color:var(--brass)}
.stagebox{margin-top:4px;border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;user-select:none}
.arrrow{display:flex;flex-wrap:wrap;gap:8px}
.arrchip{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:6px;cursor:pointer;width:112px;font-size:11.5px;color:var(--ink);text-align:center;line-height:1.25;font-family:var(--sans)}
.arrchip:hover{background:var(--surface-2)}
.arrchip.on{border-color:var(--brass);background:var(--brass-soft)}
.relrow{display:grid;grid-template-columns:170px 1fr 170px 28px;gap:8px;align-items:center;margin-top:8px}
.shaperow{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)}
.shaperow b{font-size:12.5px;display:block;margin-bottom:6px}
.insrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.insrow:last-child{border-bottom:0}
@media(max-width:900px){ .relrow{grid-template-columns:1fr} }

@media(max-width:1150px){ .builder{grid-template-columns:1fr} .sticky{position:static} }
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;overflow-y:visible;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;gap:6px}
  .brand,.railver{display:none}
  .nav{flex-direction:row;flex:none;gap:4px}
  .nav button{width:auto;white-space:nowrap}
  .main{padding:18px 16px 50px}
  .cols-2,.cols-3{grid-template-columns:1fr}
  .inline2,.inline3{grid-template-columns:1fr}
}
</style>
</head>

<script>
/* ============================ constants ============================ */
const APP_VERSION='2.4.1', APP_BUILD='2026-09-13';
const MAX_CAST=6;
const LS_KEY='inkbrass.promptforge.v1';
const PIN_MAGIC='promptforge-pin-ok';
const PBKDF2_ITERATIONS=250000;
const MAX_IMG_DIM=560;
const IMG_QUALITY=0.82;
const IDB_NAME='inkbrass.promptforge.images', IDB_STORE='images', IDB_VERSION=1;
const BACKUP_VERSION=2;
let storageAlert=null;
let idb=null;
let imageCache={};      // promptId -> {enc:false,data,w,h} for unprotected saved images
const SEED=JSON.parse(document.getElementById('seed').textContent);
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];

/* The eleven axes that the four reference prompts all covered. Coverage of
   these — not prompt length — is what separates a first-time hit from a
   near-miss, so the builder scores against them explicitly. */
const AXES=[
  ['subject','Subject'],['wardrobe','Wardrobe'],['pose','Pose'],['scene','Scene'],
  ['composition','Composition'],['lighting','Lighting'],['colour','Colour'],
  ['camera','Camera'],['style','Style'],['mood','Mood'],['negative','Negatives']
];

/* ============================ per-subject field groups (2.0) ============================
   Every figure in the cast carries its own copy of these. The same declarative
   entries drive the subject card, the JSON writer, coverage and the lints. `part`
   names the parts-library type a group saves to and inserts from. */
const SUBJ_GROUPS=[
{id:'identity',title:'Identity',part:'character',axis:'subject',fields:[
  {k:'subj_type',q:'Who or what is the subject?',hint:'A concrete noun phrase, e.g. "young woman", "middle-aged man", "reptilian humanoid".',t:'text',o:['Young woman','Young man','Middle-aged woman','Middle-aged man','Older woman','Older man','Child (non-photoreal illustration only)','Animal','Object / product','Landscape (no subject)']},
  {k:'subj_age',q:'Age band?',hint:'State adulthood explicitly for any human subject. Ambiguity here is the single most common cause of an unusable render.',t:'text',o:['early 20s (clearly adult)','mid 20s (clearly adult)','early 30s','late 30s','40s','50s','60s+']},
  {k:'subj_aesthetic',q:'Overall aesthetic or look?',hint:'A named look carries a whole styling vocabulary in two or three words.',t:'text',o:['clean girl, K-beauty influence','old money','minimalist Scandinavian','grunge','athleisure','vintage 1970s','Norse-futurism','workwear']},
  {k:'makeup_style',q:'Makeup approach?',t:'text',o:['no-makeup makeup','soft glam','bold graphic liner','bare skin, nothing applied','editorial and stylised']},
  {k:'makeup_details',q:'Makeup specifics, one per line.',t:'list'},
  {k:'subj_build',q:'Build and height?',hint:'With two or more figures a short build (\u201Ctall and athletic\u201D) also goes into the figure\u2019s handle \u2014 in testing, builds rendered only when they did. A few adjectives fit; \u201Cpetite\u201D came out slim rather than short.',t:'text',o:['slim','athletic','solid, muscular','stocky','tall and lean','average build']},
  {k:'subj_hair',q:'Hair — colour, length, style.',hint:'Name a style that exists: "short brown bob with wispy bangs" beats "nice hair".',t:'text'},
  {k:'subj_eyes',q:'Eyes?',t:'text',o:['deep blue','green','soft grey/hazel','warm brown','dark brown','amber']},
  {k:'subj_skin',q:'Skin / surface texture?',hint:'Texture language is a realism lever: "natural pores, no smoothing" pushes harder toward photography than the word "photorealistic" does.',t:'text',o:['photorealistic skin texture with natural detail','natural pores, no smoothing','dewy, high luminosity "glass skin"','weathered, sun-worn','pale emerald green soft scales','grey-brown soft fur']},
  {k:'subj_features',q:'Distinguishing features?',hint:'Scars, freckles, markings, non-human anatomy.',t:'textarea'},
]},
{id:'wardrobe',title:'Wardrobe & accessories',part:'wardrobe',axis:'wardrobe',fields:[
  {k:'ward_top_base',q:'Upper body — the layer against the skin.',hint:'Type, colour, fit, material. Four attributes, not one adjective.',t:'text'},
  {k:'ward_top_over',q:'Upper body — anything worn over it?',hint:'Leave blank for a single garment. Naming the layers separately is what stops the model fusing them into one closed piece.',t:'text',o:['open knitted cardigan','unbuttoned flannel shirt','cropped denim jacket','tailored blazer','hoodie','sheer overshirt','leather harness','fur-lined mantle over hard-light armour']},
  {k:'ward_top_how',q:'How is the upper layer worn?',hint:'The relationship between the layers — this is what makes both visible in the render rather than just the outer one.',t:'text',o:['worn open','unbuttoned','buttoned closed','half-tucked','sleeves pushed up','draped off one shoulder','tied at the waist','zipped to mid-chest']},
  {k:'ward_bottom_base',q:'Lower body — the layer against the skin.',t:'text'},
  {k:'ward_bottom_over',q:'Lower body — anything worn over it?',hint:'e.g. shorts over bikini bottoms, a wrap skirt over leggings, greaves over trousers.',t:'text',o:['denim shorts','open wrap skirt','tactical overtrousers','sarong','leg armour / greaves']},
  {k:'ward_bottom_how',q:'How is the lower layer worn?',t:'text',o:['worn over, base visible at the waist','worn over, base fully covered','open at the front','rolled at the cuff','tucked into boots']},
  {k:'ward_shoes',q:'Footwear?',hint:'Only visible below a three-quarter crop, but state it whenever the feet are in frame or the model will improvise a different pair per figure.',t:'text',o:['white low-profile sneakers','black leather ankle boots','tan leather sandals','court shoes','work boots','barefoot','running shoes','loafers']},
  {k:'ward_outer',q:'Full-length outerwear or headwear?',hint:'A coat, cloak or hat that sits over everything above.',t:'text'},
  {k:'ward_acc',q:'Accessories and jewellery?',hint:'Small named objects read as strong realism cues — "small delicate gold butterfly stud earrings" carried a lot of Prompt2.',t:'textarea'},
]},
{id:'pose',title:'Pose & action',part:'pose',axis:'pose',fields:[
  {k:'subj_expr',axis:'subject',q:'Expression?',t:'text',o:['surprised and delighted','soft, neutral, direct gaze','slight smile','serious, appraising','laughing','looking over sunglasses with a slight smile']},
  {k:'pose_body',q:'What is the body doing?',hint:'Position, weight, angle to camera. This figure\u2019s own action only \u2014 what it does to another figure goes in Staging, as an interaction.',t:'textarea'},
  {k:'pose_hands',q:'What are the hands doing?',hint:'Hands are the most common render failure. Naming them explicitly gives the model something to solve for.',t:'text'},
  {k:'pose_gaze',q:'Where is the subject looking?',t:'text',o:['directly at camera','away from camera','over the shoulder at camera','down at something held','into the middle distance']},
]},
{id:'mixed',title:'Render style & scale',hint:'Only needed when figures differ in render style or scale \u2014 example 01 pairs a photographic man with a Pixar-style miniature of himself standing in his hand.',fields:[
  {k:'rstyle',q:'Is this figure rendered in a different style from the others?',t:'text',o:['same style as the other figures','Pixar-style 3D character render','stylised illustration','miniature figurine / vinyl toy']},
  {k:'scale',q:'Relative scale and placement?',t:'text',o:['miniature, resting in the subject\u2019s hand','same scale, beside the subject','behind the subject, out of focus','small, in the foreground']},
  {k:'lock',q:'What must stay consistent with another figure?',hint:'An explicit consistency constraint. Prompt1 used "matching hairstyle and outfit of the real human" and got it.',t:'text',o:['matching hairstyle and outfit','matching face and colouring','nothing — deliberately different']},
]}
];

/* ============================ field schema ============================
   Declarative so the form, the JSON writer, the natural-language writer and
   the coverage meter all read from one definition. `j` is the output path. */
const SECTIONS=[
{id:'intent',title:'Intent',always:true,fields:[
  {k:'summary',q:'Describe the shot in one sentence.',hint:'This becomes the plain-language anchor line. Prompt3 carried one of these alongside its structured keys and rendered its scene almost exactly — the sentence sets global composition, the keys refine it.',t:'textarea'},
]},
{id:'cast',title:'Cast',always:true,special:'cast',fields:[]},
{id:'staging',title:'Staging',special:'staging',fields:[
  {k:'style_sep',q:'If the figures differ in render style, how should the styles relate?',hint:'When one subject is photographic and the other rendered, saying so explicitly keeps each from bleeding into the other.',t:'text',o:['the two styles stay distinct and neither bleeds into the other','the rendered subject picks up the same lighting as the photographic one','both are rendered in the same style']},
  {k:'stage_notes',q:'Anything else about the group, one line each?',hint:'Free-form statements that belong to the group rather than to any one figure \u2014 "all three are soaked from the rain". Interactions between two named figures are better as rows above.',t:'list'},
]},
{id:'scene',title:'Scene & environment',always:true,axis:'scene',fields:[
  {k:'loc',q:'Where is this?',hint:'A named real place carries an enormous amount of detail for free. "Positano, Amalfi Coast" produced the church dome unprompted.',t:'text'},
  {k:'time',q:'Time of day?',t:'text',o:['golden hour','midday','blue hour','overcast afternoon','night','indoor, no time cue']},
  {k:'bg_elements',q:'List the background elements you want visible.',hint:'One item per line. Enumerating beats describing — the model places each named element rather than inventing a generic backdrop.',t:'list'},
  {k:'bg_distance',q:'How far is the background?',t:'text',o:['far (distant vista)','mid-distance','close (interior wall)','seamless studio backdrop']},
  {k:'bg_fg',q:'Foreground \u2014 anything between the camera and the figures?',hint:'Recommended when the objects matter. In testing, three objects given one plane each came out separate in 3 of 3 renders; the same three in one flat list clustered, and the column was dropped in 2 of 3. With several figures, a prop that can be stood on (a plinth, a block) was stood on or stacked with another object in 5 of 5 renders. Leave all three empty to keep the single list above.',t:'list'},
  {k:'bg_mid',q:'Midground \u2014 around the figures?',t:'list'},
  {k:'bg_back',q:'Far background?',t:'list'},
]},
{id:'composition',title:'Composition & framing',always:true,axis:'composition',fields:[
  {k:'framing',q:'Framing?',d:'framing',t:'text',o:['extreme close-up (eyes and mouth only)','macro detail \u2014 a single feature filling the frame','close-up \u2014 the face fills the frame','medium close-up \u2014 head and shoulders','bust shot \u2014 chest up','medium shot \u2014 waist up','cowboy shot \u2014 mid-thigh up','three-quarter shot \u2014 knees up','full body shot','full body with generous margin','wide shot \u2014 subject small in the setting','extreme wide / establishing shot','environmental portrait \u2014 subject small, context large','over-the-shoulder framing','two-shot \u2014 two subjects in frame','group shot','cropped portrait \u2014 face cropped at the frame edge','profile crop \u2014 cropped into the side of the face','hands and held object detail','overhead flat lay']},
  {k:'angle',q:'Camera angle?',d:'angle',t:'text',o:['eye level','slightly low angle, looking up','low angle, strong upward perspective','worm\u2019s eye view from the ground','slightly high angle, looking down','high angle, looking down','bird\u2019s eye view','directly overhead / top-down','hip level','knee level','ground level, lens near the floor','dutch tilt \u2014 canted horizon','over-the-shoulder','three-quarter front angle','profile \u2014 90\u00B0 side view','three-quarter rear angle','from directly behind','mirror selfie, phone visible','first-person POV','shot through a foreground frame (doorway, window, arch)']},
  {k:'placement',q:'Where does the subject sit in the frame?',d:'placement',t:'text',o:['centred, symmetrical','centred, low in frame','centred, high in frame','lower-left intersection (rule of thirds)','lower-right intersection (rule of thirds)','upper-left intersection (rule of thirds)','upper-right intersection (rule of thirds)','left third, negative space right','right third, negative space left','offset left, looking into the frame','offset right, looking into the frame','foreground, centre-right','foreground, centre-left','filling the frame edge to edge','small in frame, dwarfed by the setting','framed by foreground elements on both sides','along a diagonal from lower left to upper right','at the end of a leading line','reflected in a mirror or water','partially cropped by the frame edge']},
  {k:'dof',q:'Depth of field?',d:'dof',t:'text',o:['very shallow \u2014 eyes sharp, ears already soft','shallow \u2014 subject sharp, background well blurred','shallow with creamy bokeh highlights','shallow with circular bokeh from point lights','shallow with swirled vintage bokeh','moderate \u2014 background soft but readable','deep \u2014 subject and background both sharp','hyperfocal \u2014 foreground to horizon sharp','foreground blurred, subject sharp','foreground and background both soft, subject in a sharp band','background blurred into flat colour','background blurred into soft gradient tones','focus falls off only behind the subject','tilt-shift \u2014 a narrow diagonal band of sharpness','soft focus overall, no hard edge anywhere','split focus \u2014 two planes sharp','focus on the hands, face slightly soft','focus on a foreground object, subject soft behind','subject sharp against a fully defocused crowd','minimal separation \u2014 background nearly as sharp']},
  {k:'focus',q:'What must be tack sharp?',t:'text',o:['the eyes','the near eye','both faces','the whole frame','the held object','the hands','the face and hands','lips and skin texture','fabric texture and weave','hair strands','the foreground detail','the text or signage','the background, subject soft','the horizon','the reflection']},
  {k:'lines',q:'Leading lines or structural elements?',t:'text',o:['the boat railing','a road running to the horizon','a staircase','corridor walls converging','the shoreline','a fence line','a hallway','a tree line','tiled floor joints','an archway','a window frame','converging building edges','a shaft of light','hard shadow lines across the ground','a diagonal beam or rafter','the edge of a table']},
]},
{id:'panels',title:'Multi-panel layout',toggle:true,fields:[
  {k:'panel_struct',q:'Grid structure?',t:'text',o:['2-panel vertical split','2-panel horizontal split','4-panel split-screen grid','3-panel triptych']},
  {k:'panel_div',q:'Divider treatment?',t:'text',o:['thick white diagonal borders','thin white gutters','no dividers, edge to edge','black gutters']},
  {k:'panel_style',q:'Overall layout aesthetic?',t:'text',o:['modern magazine spread aesthetic','contact sheet','polaroid scatter','clinical grid, no styling']},
  {k:'panel_list',q:'Describe each panel, one per line.',hint:'Naming each cell is the whole trick — it is what stopped Prompt2\u2019s four-up collapsing into four near-identical crops. Format: "top left: close-up 3/4 angle, focus on cheek highlight".',t:'list'},
]},
{id:'lighting',title:'Lighting',always:true,axis:'lighting',fields:[
  {k:'light_src',q:'Light source?',t:'text',o:['natural sunlight','soft cinematic studio lighting','soft commercial studio lighting with ring light','window light','practical/ambient interior light','warm afternoon light']},
  {k:'light_qual',q:'Quality of the light?',t:'text',o:['soft and warm','hard and directional','diffuse and even','high contrast, deep shadows','clean highlights, iPhone realism']},
  {k:'light_dir',q:'Direction?',t:'text',o:['from the right, slightly backlit','from the left','frontal','overhead','rim light from behind']},
  {k:'light_shadow',q:'How should shadows behave?',hint:'Soft floor shadows are a fixed cost on this model: \u201Cshadowless\u201D left them in every test render, and a positive floor statement (\u201Cthe floor is evenly bright right up to and under her feet\u201D) changed nothing measurable when it was the only change. Avoid naming large equipment \u2014 \u201Ca large overhead diffusion panel\u201D drew a softbox and stand into the frame in 4 of 4 renders.',t:'text',o:['soft, well-defined','gentle falloff','long and dramatic','minimal — flat lighting']},
  {k:'light_hi',q:'Where do the highlights land?',hint:'Specifying highlights is the difference between "lit" and "photographed". Prompt3 called them on water, railing and hair.',t:'text'},
  {k:'light_sep',q:'Subject/background separation?',t:'text',o:['subtle rim light','none needed','strong backlight halo']},
]},
{id:'colour',title:'Colour',always:true,axis:'colour',fields:[
  {k:'col_scheme',q:'Colour scheme?',t:'text',o:['analogous blues and greens with warm earth tones','warm neutrals','cool desaturated','high-contrast complementary','monochrome']},
  {k:'col_sat',q:'Saturation?',t:'text',o:['high','medium','low / desaturated']},
  {k:'col_contrast',q:'Contrast?',t:'text',o:['medium-high','high','medium','low / flat']},
  {k:'col_grade',q:'Grading note?',t:'text',o:['desaturated background, warm skin tones','filmic, lifted blacks','clean and neutral','golden warm cast']},
  {k:'col_palette',q:'Pin the palette with hex codes.',hint:'Prompt3 supplied five. Hex is read literally and is the most reliable way to control colour.',t:'colors'},
]},
{id:'camera',title:'Camera & optics',always:true,axis:'camera',fields:[
  {k:'cam_body',q:'Camera?',hint:'A named body pulls the render toward that camera\u2019s real output characteristics.',t:'text',o:['DSLR or mirrorless','Canon EOS R5','Sony A7 IV','Fujifilm X-T5 with film simulation','Leica M11 rangefinder','Hasselblad medium format','Pentax 645 medium format film','Mamiya RZ67','Rolleiflex TLR','35mm film SLR','Contax T2 point-and-shoot','Olympus mju-II compact','disposable film camera','Polaroid instant camera','iPhone 15 Pro','Google Pixel','GoPro action camera','drone camera','cinema camera (ARRI Alexa)','security camera / CCTV']},
  {k:'cam_lens',q:'Lens?',d:'lens',t:'text',o:['8mm fisheye','14mm ultra-wide','16mm wide','20mm wide','24mm wide','28mm wide','35mm reportage','40mm','50mm standard','85mm portrait','100mm macro','105mm portrait','135mm telephoto','200mm telephoto','300mm long telephoto','24-70mm zoom at 70mm','70-200mm zoom at 200mm','24mm tilt-shift','anamorphic 40mm','vintage Helios 44-2 (swirled bokeh)']},
  {k:'cam_ap',q:'Aperture?',d:'aperture',t:'text',o:['f/0.95 \u2014 extreme','f/1.2 \u2014 wide open','f/1.4','f/1.8','f/2','f/2.8','f/3.5','f/4','f/5.6','f/6.3','f/8 \u2014 the sweet spot','f/11','f/13','f/16 \u2014 sun stars on point lights','f/22','wide open for maximum separation','stopped down for edge-to-edge sharpness','f/1.4 with heavy bokeh','f/8 for a readable background','f/16 for a deep landscape']},
  {k:'cam_iso',q:'ISO / grain?',t:'text',o:['ISO 50 \u2014 clean','ISO 100','ISO 200','ISO 400 \u2014 slight grain','ISO 800','ISO 1600 \u2014 visible grain','ISO 3200 \u2014 heavy grain','ISO 6400 \u2014 noisy low light','pushed film grain','Portra 400 grain','Tri-X 400 black and white grain','Cinestill 800T with halation','low, clean','moderate']},
  {k:'cam_shutter',q:'Shutter?',t:'text',o:['1/4000 \u2014 freezes everything','1/1000','1/500','1/250','1/125','1/60 \u2014 slight motion in fast hands','1/30 \u2014 hand blur','1/15','1/8','1 second long exposure','30 second exposure, star trails','panning blur, subject sharp','second-curtain flash with motion trail','fast enough to freeze motion','not specified']},
]},
{id:'text',title:'Text in image',toggle:true,fields:[
  {k:'txt_content',q:'Exact text to render.',hint:'Short strings render far more reliably than long ones. "BLU RIDE" came out clean.',t:'text'},
  {k:'txt_where',q:'Where does it sit?',t:'text'},
  {k:'txt_font',q:'Font treatment?',t:'text',o:['sans-serif, uppercase, bold','serif, title case','handwritten script','condensed industrial stencil']},
  {k:'txt_col',q:'Text colour (hex).',t:'text'},
]},

/* ============================ state ============================ */
/* v1.0 stored one string per garment slot. v1.1 splits each into base/over
   layers — an old value is the layer against the skin, so it migrates to
   _base and the new layer fields start empty. Runs on load and on import, so
   older backups keep restoring correctly. */
function migrateFields(f){
  if(!f) return f;
  if(f.ward_top && !f.ward_top_base){ f.ward_top_base=f.ward_top; delete f.ward_top; }
  if(f.ward_bottom && !f.ward_bottom_base){ f.ward_bottom_base=f.ward_bottom; delete f.ward_bottom; }
  return f;
}
/* consts used by migration, which runs at load time (before the state block) */
const SUBJ_KEYS=SUBJ_GROUPS.flatMap(g=>g.fields.map(f=>f.k));
const OLD_SEC_MAP={sec_type:'subj_type',sec_style:'rstyle',sec_scale:'scale',sec_lock:'lock',sec_expr:'subj_expr'};
const ORD=['first','second','third','fourth','fifth','sixth'];
const NUMW=['zero','one','two','three','four','five','six'];
function migrateDB(d){
  d.prompts=d.prompts||[];
  d.prompts.forEach(p=>{ if(!p.protected){ if(!p.mode) p.mode='turbo'; migrateContent(p); } });
  d.parts=d.parts||[];
  /* 1.x kept subject and wardrobe together as one "character". 2.0 splits a
     character into identity only, plus a separate wardrobe part and (if an
     expression was stored) a pose part, so each can be recombined freely. */
  if(Array.isArray(d.characters)){
    d.characters.forEach(c=>{
      const f=migrateFields({...(c.fields||{})});
      const pick=keys=>{ const o={}; keys.forEach(k=>{ if(f[k]) o[k]=f[k]; }); return o; };
      const now=todayStr();
      const idf=pick(groupKeys('identity')), wf=pick(groupKeys('wardrobe')), pf=pick(groupKeys('pose'));
      if(Object.keys(idf).length) d.parts.push({id:'pt'+uid(),type:'character',name:c.name,tags:'',f:idf,updated:now});
      if(Object.keys(wf).length)  d.parts.push({id:'pt'+uid(),type:'wardrobe',name:c.name+' \u2014 outfit',tags:'',f:wf,updated:now});
      if(Object.keys(pf).length)  d.parts.push({id:'pt'+uid(),type:'pose',name:c.name+' \u2014 expression',tags:'',f:pf,updated:now});
    });
    delete d.characters;
  }
  if(d.security===undefined) d.security=null;
  d.version=2;
  /* backupVersion 2 fields are backup-only (images travel in a top-level map,
     see buildBackupObject/applyImportedImages) and must never land back in
     localStorage — strip them at every point data flows through migrateDB. */
  delete d.images; delete d.backupVersion;
  return d;
}
let db=loadDB();
/* The first 2.0 load of a 1.x store keeps an untouched copy of the raw 1.x data
   under a sibling key, so opening 1.7.0 again is recoverable. Best effort only:
   if storage is too full to hold two copies, the export backup is the fallback. */
function loadDB(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){
      const d=JSON.parse(raw);
      if(!(d.version>=2)){ try{ localStorage.setItem(LS_KEY+'.pre2', raw); }catch(e){} }
      return migrateDB(d);
    }
  }catch(e){}
  return migrateDB(structuredClone(SEED));
}
/* Honest save: returns whether the write actually happened. A toast is not a
   failure channel — it is transient and self-overwriting, so any caller that
   raises a success toast must gate it on this return value. The banner is the
   catch-all: it appears on any failed write, persists until a save actually
   succeeds, and can't be overwritten by an unrelated toast. */
function saveDB(){
  try{
    localStorage.setItem(LS_KEY,JSON.stringify(db));
    setStorageAlert(null);
    return true;
  }catch(e){
    setStorageAlert('NOT SAVED — '+((e&&e.name)||'storage error')+'. Your changes exist only in this tab and will be lost when it closes. Export a backup now.');
    return false;
  }
}
function setStorageAlert(msg){
  storageAlert=msg||null;
  const el=document.getElementById('savealert');
  if(!el) return;
  if(storageAlert){ el.textContent=storageAlert; el.hidden=false; }
  else { el.textContent=''; el.hidden=true; }
}

/* ============================ crypto (AES-GCM, key from PIN via PBKDF2) ============================
   Matches the scheme in Prompt Vault: a PIN is stretched via PBKDF2-SHA256
   into an AES-GCM key. Protected library prompts are encrypted whole
   (name, archetype, mode, enabled sections, field answers, reference image)
   under that key; the PIN unlocks all of them for the browser session. */
let sessionKey=null;        // CryptoKey — present only while unlocked this session
let decryptedCache={};      // promptId -> {name,archetype,mode,enabled,f,image}
let pinAfterFn=null;
let pendingEncryptedImport=null;   // wrapper object awaiting a PIN during an encrypted-backup import
function buf2b64(buf){
  const bytes=new Uint8Array(buf); let bin=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  return btoa(bin);
}
function b642buf(b64){ const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return arr.buffer; }
async function deriveKey(pin, saltB64, iterations){
  const km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), {name:'PBKDF2'}, false, ['deriveKey']);
  const salt=new Uint8Array(b642buf(saltB64));
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptJSON(obj, key){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const data=new TextEncoder().encode(JSON.stringify(obj));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, data);
  return {iv:buf2b64(iv), ct:buf2b64(ct)};
}
async function decryptJSON(enc, key){
  const iv=new Uint8Array(b642buf(enc.iv));
  const plain=await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, b642buf(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function setupPin(pin){
  const saltB64=buf2b64(crypto.getRandomValues(new Uint8Array(16)).buffer);
  const key=await deriveKey(pin, saltB64, PBKDF2_ITERATIONS);
  const verifier=await encryptJSON({m:PIN_MAGIC}, key);
  db.security={salt:saltB64, iterations:PBKDF2_ITERATIONS, verifier};
  const ok=saveDB();
  sessionKey=key; decryptedCache={};
  return ok;
}
/* Decrypts one protected prompt's content and reunites it with its image.
   A pre-2.4 record may still carry the image sealed inside enc rather than
   in the image store — that's migrated in place here: the image moves out to
   its own encrypted IDB record and enc is rewritten without it. Otherwise the
   (already-encrypted) image record is fetched from the store and decrypted
   alongside the content. Used by both tryUnlock and an encrypted-backup
   import, which face the same legacy-shape question. */
async function decryptPromptWithImage(p, key){
  const c=await decryptJSON(p.enc, key);
  if(c.image && c.image.data){
    const img=c.image; delete c.image;
    const blob=await encryptJSON({data:img.data,w:img.w,h:img.h}, key);
    if(await idbPut(p.id, {enc:true, blob})) p.enc=await encryptJSON(c, key);
    c.image=img;
  } else {
    const rec=await idbGet(p.id);
    if(rec && rec.enc){ try{ c.image=await decryptJSON(rec.blob, key); }catch(e){} }
  }
  return c;
}
async function tryUnlock(pin){
  if(!db.security) return false;
  try{
    const key=await deriveKey(pin, db.security.salt, db.security.iterations);
    const check=await decryptJSON(db.security.verifier, key);
    if(check.m!==PIN_MAGIC) return false;
    sessionKey=key; decryptedCache={};
    for(const p of db.prompts){
      if(!(p.protected && p.enc)) continue;
      try{
        decryptedCache[p.id]=await decryptPromptWithImage(p, key);
      }catch(e){ continue; }
    }
    saveDB();
    return true;
  }catch(e){ return false; }
}
async function changePin(newPin){
  const saltB64=buf2b64(crypto.getRandomValues(new Uint8Array(16)).buffer);
  const newKey=await deriveKey(newPin, saltB64, PBKDF2_ITERATIONS);
  for(const p of db.prompts){
    if(!p.protected) continue;
    const c=decryptedCache[p.id]; if(!c) continue;
    const image=c.image, contentNoImg={...c}; delete contentNoImg.image;
    p.enc=await encryptJSON(contentNoImg, newKey);
    /* Re-encrypting enc without also re-encrypting the image record is the
       easiest thing here to miss — it leaves that image permanently
       unreadable under the new key. */
    if(image) await idbPut(p.id, {enc:true, blob:await encryptJSON({data:image.data,w:image.w,h:image.h}, newKey)});
  }
  db.security={salt:saltB64, iterations:PBKDF2_ITERATIONS, verifier:await encryptJSON({m:PIN_MAGIC}, newKey)};
  sessionKey=newKey;
  return saveDB();
}
function lockNow(){ sessionKey=null; decryptedCache={}; render(); toast('Locked'); }
function renderLockbox(){
  const el=$('#lockbox'); if(!el) return;
  if(!db.security){ el.innerHTML=''; return; }
  el.innerHTML='<div class="lockbox"><div class="st">'+(sessionKey?'\u{1F513} Unlocked':'\u{1F512} Locked')+'</div>'+
    '<button onclick="'+(sessionKey?'lockNow()':'openPinUnlockModal()')+'">'+(sessionKey?'Lock now':'Unlock')+'</button></div>';
}

/* ============================ reference-render image handling ============================
   Resizes/re-encodes an uploaded render client-side before it ever touches
   storage: long edge capped at MAX_IMG_DIM, re-encoded as JPEG at IMG_QUALITY.
   This is a documentary "this prompt produced this" record, not the exact
   original file. */
function resizeImageFile(file, cb){
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>MAX_IMG_DIM || h>MAX_IMG_DIM){
        if(w>=h){ h=Math.round(h*MAX_IMG_DIM/w); w=MAX_IMG_DIM; } else { w=Math.round(w*MAX_IMG_DIM/h); h=MAX_IMG_DIM; }
      }
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb({data:canvas.toDataURL('image/jpeg', IMG_QUALITY), w, h});
    };
    img.onerror=()=>toast('Could not read that image');
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

/* ============================ image blob store (IndexedDB) ============================
   In Chrome, every file:// page shares one localStorage origin with a ~5MB cap;
   reference-render images are the only bulk payload in this app, so they live
   in IndexedDB instead. Metadata (everything else) stays in localStorage — it's
   small, synchronous, and keeps render paths simple.
     unprotected: {enc:false, data:<jpeg dataURL>, w, h}
     protected:   {enc:true,  blob:{iv,ct}}   (AES-GCM of {data,w,h}, same PIN key)
   Every wrapper resolves rather than rejects — a storage layer that throws
   turns one bad record into a blank screen. */
function openImageDB(){
  return new Promise(resolve=>{
    try{
      const req=indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded=()=>{ const d=req.result; if(!d.objectStoreNames.contains(IDB_STORE)) d.createObjectStore(IDB_STORE); };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>resolve(null);
    }catch(e){ resolve(null); }
  });
}
function idbStore(mode){ if(!idb) return null; try{ return idb.transaction(IDB_STORE, mode).objectStore(IDB_STORE); }catch(e){ return null; } }
function idbGet(id){
  return new Promise(resolve=>{
    const st=idbStore('readonly'); if(!st) return resolve(null);
    try{ const req=st.get(id); req.onsuccess=()=>resolve(req.result||null); req.onerror=()=>resolve(null); }catch(e){ resolve(null); }
  });
}
function idbPut(id, rec){
  return new Promise(resolve=>{
    const st=idbStore('readwrite');
    if(!st){ setStorageAlert('Image store unavailable — this reference image was not saved.'); return resolve(false); }
    try{
      const req=st.put(rec, id);
      req.onsuccess=()=>resolve(true);
      req.onerror=()=>{ setStorageAlert('NOT SAVED — image store is full or unavailable. Export a backup now.'); resolve(false); };
    }catch(e){ setStorageAlert('NOT SAVED — image store is full or unavailable. Export a backup now.'); resolve(false); }
  });
}
function idbDelete(id){
  return new Promise(resolve=>{
    const st=idbStore('readwrite'); if(!st) return resolve(false);
    try{ const req=st.delete(id); req.onsuccess=()=>resolve(true); req.onerror=()=>resolve(false); }catch(e){ resolve(false); }
  });
}
function idbClear(){
  return new Promise(resolve=>{
    const st=idbStore('readwrite'); if(!st) return resolve(false);
    try{ const req=st.clear(); req.onsuccess=()=>resolve(true); req.onerror=()=>resolve(false); }catch(e){ resolve(false); }
  });
}
function idbEntries(){
  return new Promise(resolve=>{
    const st=idbStore('readonly'); if(!st) return resolve({});
    try{
      const out={}; const req=st.openCursor();
      req.onsuccess=()=>{ const cur=req.result; if(cur){ out[cur.key]=cur.value; cur.continue(); } else resolve(out); };
      req.onerror=()=>resolve(out);
    }catch(e){ resolve({}); }
  });
}
/* The single accessor every render path goes through — nothing reads a
   prompt's image field directly. p is a db.prompts record (or anything
   shaped like one: {id, protected}). */
function imageFor(p){
  if(!p) return null;
  if(p.protected){ const c=decryptedCache[p.id]; return (c&&c.image)||null; }
  return imageCache[p.id]||null;
}
async function loadImageCache(){
  imageCache={};
  if(!idb) return;
  const entries=await idbEntries();
  for(const id in entries){ const rec=entries[id]; if(rec && !rec.enc) imageCache[id]=rec; }
}
/* Migrates any pre-2.4 record that still carries an inline p.image into the
   blob store. Protected records can't be touched here — their image (if any)
   is still sealed inside enc and gets migrated at unlock time instead. The
   `return false` on a failed write is load-bearing: never delete the only
   copy of something the store couldn't take. */
async function migrateInlineImages(){
  let moved=0;
  for(const p of db.prompts){
    if(p.protected || !p.image || !p.image.data) continue;
    if(!await idbPut(p.id, {enc:false, data:p.image.data, w:p.image.w, h:p.image.h})) return false;
    delete p.image; moved++;
  }
  if(moved) saveDB();
  return true;
}

/* ============================ backup format (backupVersion 2) ============================
   A backup must stay one self-contained file, so images travel in a top-level
   `images` map rather than inline on each record. Both export paths (plain
   and encrypted) use buildBackupObject(); import handles both this shape and
   a legacy v1 backup with images still inline on the prompt records. */
async function buildBackupObject(){
  const images=await idbEntries();
  return Object.assign({}, db, {backupVersion:BACKUP_VERSION, images});
}
async function applyImportedImages(imgMap){
  await idbClear();   // an import is a restore, not a merge
  let ok=true;
  if(imgMap && typeof imgMap==='object'){
    for(const id in imgMap){ if(!await idbPut(id, imgMap[id])) ok=false; }
  }
  for(const p of db.prompts){
    if(p.protected || !p.image || !p.image.data) continue;  // legacy v1 inline images
    if(!await idbPut(p.id, {enc:false, data:p.image.data, w:p.image.w, h:p.image.h})) ok=false;
    delete p.image;
  }
  await loadImageCache();
  return ok;
}

let openSecs=new Set(['intent','cast']);
let openGroups=new Set(['identity']);
let activeSubj=0;
let outTab='nested';
let view='builder';
let editingId=null;

/* ============================ cast model (2.0) ============================
   draft.f holds the shot-level answers. Everything about a figure lives in
   draft.cast[i].f, keyed by the same field keys the 1.x subject block used, so a
   saved character part slots into any figure unchanged. `name` is a UI label
   only and is never emitted; `handle` overrides the derived in-prompt handle. */
function sid(){ return 's'+Date.now().toString(36).slice(-3)+Math.random().toString(36).slice(2,7); }
function newSubject(){ return {id:sid(),name:'',handle:'',f:{}}; }
function newStaging(hc){ return {arr:'',phrase:'',pos:{},rel:[],headcount:!!hc}; }
function newDraft(){ return {name:'',archetype:'blank',mode:'turbo',enabled:{},f:{},cast:[newSubject()],staging:newStaging(true),outShape:null,protected:false,image:null}; }
function groupKeys(id){ const g=SUBJ_GROUPS.find(x=>x.id===id); return g?g.fields.map(f=>f.k):[]; }
/* Converts any 1.x prompt content ({enabled, f} with subject keys and the
   optional sec_* second subject) into the 2.0 shape in place. Idempotent. A
   migrated two-subject prompt keeps outShape 'classic', so it emits exactly the
   JSON it did before. Its staging starts with the headcount off for the same
   reason: nothing is added to a prompt that was already rendered. */
function migrateContent(c){
  if(!c) return c;
  c.enabled=c.enabled||{}; c.f=c.f||{};
  migrateFields(c.f);
  if(!Array.isArray(c.cast)){
    const p=newSubject();
    SUBJ_KEYS.forEach(k=>{ if(c.f[k]!==undefined){ if(c.f[k]!=='') p.f[k]=c.f[k]; delete c.f[k]; } });
    c.cast=[p];
    if(c.enabled.second){
      const s=newSubject();
      for(const k in OLD_SEC_MAP) if(c.f[k]) s.f[OLD_SEC_MAP[k]]=c.f[k];
      c.cast.push(s);
      c.outShape='classic';
    }
    for(const k in OLD_SEC_MAP) delete c.f[k];
    delete c.enabled.second;
  }
  c.cast.forEach(s=>{ s.f=s.f||{}; migrateFields(s.f); if(!s.id) s.id=sid(); if(s.name==null) s.name=''; if(s.handle==null) s.handle=''; });
  if(!c.staging) c.staging=newStaging(false);
  const st=c.staging; st.pos=st.pos||{}; st.rel=st.rel||[]; if(st.arr==null) st.arr=''; if(st.phrase==null) st.phrase=''; st.headcount=!!st.headcount;
  if(c.outShape===undefined) c.outShape=null;
  return c;
}

/* ============================ helpers ============================ */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function todayStr(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2500);}
function allFields(){return SECTIONS.flatMap(s=>s.fields.map(f=>({...f,sec:s})));}
function fieldById(k){return allFields().find(f=>f.k===k);}
function secActive(s){ return s.always || (s.id==='staging' ? castN()>=2 : !!draft.enabled[s.id]); }
function castN(){ return draft.cast.length; }
function S(i){ return draft.cast[i]; }
function P(){ return draft.cast[0]; }
function sval(s,k){ return ((s&&s.f[k])||'').trim(); }
function slist(s,k){ return sval(s,k).split('\n').map(x=>x.trim()).filter(Boolean); }
function cap(t){ return t?t.charAt(0).toUpperCase()+t.slice(1):t; }
function subjLabel(i){
  const s=S(i); if(!s) return '';
  return (s.name||'').trim() || sval(s,'subj_type') || ('Subject '+(i+1));
}

/* ---- handles: how the prompt refers to each figure ----
   Derived from type plus the fewest traits needed to make every handle unique.
   Hair is tried first (most visible at any crop), then a non-generic skin
   description, then the upper garment. A UI name is never used: it gives the
   model nothing it can draw and is one more string it might caption. */
function firstChunk(t){ return (t||'').split(/[,;]/)[0].trim(); }
function shortWords(t,n){ return t.split(/\s+/).slice(0,n).join(' '); }
const GENERIC_SKIN=/pores|photoreal|texture|smoothing|realistic|natural detail|luminosity/i;
function typeNoun(s){
  let t=sval(s,'subj_type').replace(/\([^)]*\)/g,'').replace(/^(?:a|an|the)\s+/i,'').trim();
  if(t.length>1 && /[a-z]/.test(t.charAt(1))) t=t.charAt(0).toLowerCase()+t.slice(1);
  return t;
}
/* three trait slots, in preference order: hair, non-generic skin, upper garment */
function handleTraits(s){
  const hair=firstChunk(sval(s,'subj_hair'));
  const skin=firstChunk(sval(s,'subj_skin'));
  const top=firstChunk(sval(s,'ward_top_over')||sval(s,'ward_top_base'));
  return [
    hair?'with '+hairNP(shortWords(hairWords(hair),6)):'',
    (skin&&!GENERIC_SKIN.test(skin))?'with '+shortWords(skin,5):'',
    top?'in the '+shortWords(top,4):''
  ];
}
const HAIR_STYLE_RE=/hair|mohawk|bald|shaved|braid|bun|bob|crop|pixie|curls|waves|locks|fringe|bangs|undercut|afro|ponytail|mane|dreadlock/i;
/* "blonde" -> "blonde hair"; a phrase that already names the hair or a style is left alone.
   2.2: the prose writer uses this too (it used to write "long straight black hair hair"). */
function hairWords(h){ return HAIR_STYLE_RE.test(h)?h:h+' hair'; }
/* 2.2: a countable hairstyle takes an article ("with a short platinum-blonde bob") */
function hairNP(h){
  if(/\bhair\b|^(?:a|an|the|her|his|their)\b/i.test(h)) return h;
  if(/\b(?:bob|cut|crop|ponytail|bun|braid|plait|mohawk|fringe|undercut|afro|mane|topknot|quiff|pompadour|mullet|fade|chignon)\b/i.test(h)) return (/^[aeiou]/i.test(h)?'an ':'a ')+h;
  return h;
}
/* 2.2: derived handles also carry the upper garment's colour ("the woman in the
   red t-shirt with ...") and, when it reads as a few adjectives, the build
   ("the tall, athletic woman ..."). Round 2: colour in the handle kept shirts on
   the right bodies and in the right order at five and six figures (right in
   5 of 5 renders, against 0 of 6 without); builds rendered only when they were
   carried in the handle (i08 vs i07). Both are added on top of the 2.1 rule,
   which still picks the fewest traits needed to tell the figures apart. */
const COLOUR_WORDS='red|crimson|scarlet|maroon|burgundy|wine|pink|rose|coral|orange|rust|amber|mustard|yellow|gold|golden|cream|ivory|beige|tan|camel|khaki|brown|chocolate|olive|green|emerald|sage|mint|teal|turquoise|aqua|cyan|blue|navy|cobalt|indigo|denim|purple|violet|lilac|lavender|plum|magenta|white|black|grey|gray|charcoal|silver';
const COLOUR_RE=new RegExp('\\b((?:(?:light|dark|pale|bright|deep|dusty|soft|hot|sky|royal|forest|bottle)[ -])?(?:'+COLOUR_WORDS+')(?:[ -](?:'+COLOUR_WORDS+'))?)\\b','i');
const GARMENT_RE=/\b(t-shirt|tee|tank top|crop top|halter top|tube top|polo shirt|shirt|blouse|sweater|jumper|sweatshirt|hoodie|cardigan|turtleneck|jacket|coat|blazer|waistcoat|vest|dress|gown|tunic|top|camisole|bodysuit|swimsuit|bikini top|leotard|corset|kimono|robe|mantle|cloak|cape|poncho|harness|armour|armor|uniform|overalls|jumpsuit|jersey|parka|anorak|suit|smock|apron|bralette)\b/gi;
function topChunk(s){ return firstChunk(sval(s,'ward_top_over')||sval(s,'ward_top_base')); }
function topColour(s){ const m=topChunk(s).match(COLOUR_RE); return m?m[1].toLowerCase():''; }
/* "red crew-neck cotton t-shirt, relaxed fit" -> "in the red t-shirt" */
function colourSlot(s){
  const t=topChunk(s), c=t.match(COLOUR_RE); if(!c) return '';
  const gs=[...t.matchAll(GARMENT_RE)]; if(!gs.length) return '';
  const g=gs[gs.length-1]; if(g.index<c.index) return '';
  return 'in the '+c[1].toLowerCase()+' '+g[1].toLowerCase();
}
const BUILD_NOUN=/\b(?:build|height|frame|figure|body|physique|hips?|waist|shoulders?|legs?|arms?|chest|bust|torso|muscles|curves|proportions|stature)\b/;
/* "tall and athletic" -> "tall, athletic"; anything that is not a short run of adjectives is left out */
function buildAdj(s){
  const b=sval(s,'subj_build').toLowerCase().replace(/\s+and\s+/g,', ').replace(/\s*,\s*/g,', ').trim();
  if(!b||!/^[a-z][a-z\-, ]*$/.test(b)||BUILD_NOUN.test(b)||b.split(/[\s,]+/).filter(Boolean).length>4) return '';
  return b;
}
/* 2.1: when handles collide, add the first trait slot that actually varies
   inside the colliding group. A trait every member shares (the same hair on
   all three) cannot separate them and only lengthens every handle. */
function derivedHandles(){
  const base=draft.cast.map((s,i)=>({noun:typeNoun(s),slots:handleTraits(s),used:[],i,col:colourSlot(s),bld:buildAdj(s)}));
  /* uniqueness is settled without colour and build; `full` adds them afterwards.
     A handle that already names the whole upper garment gets no colour slot. */
  const make=(b,full)=>{
    if(!b.noun) return 'the '+ORD[b.i]+' figure';
    const ex=[]; if(full&&b.col&&!b.used.includes(2)) ex.push(b.col);
    b.used.forEach(k=>ex.push(b.slots[k]));
    return 'the '+(full&&b.bld?b.bld+' ':'')+b.noun+(ex.length?' '+ex.join(' '):'');
  };
  for(let pass=0;pass<4;pass++){
    const hs=base.map(b=>make(b,false)), groups={}; let changed=false;
    hs.forEach((h,i)=>{ (groups[h]=groups[h]||[]).push(i); });
    Object.values(groups).forEach(g=>{
      if(g.length<2) return;
      const k=[0,1,2].find(k=>g.every(i=>!base[i].used.includes(k))&&new Set(g.map(i=>base[i].slots[k])).size>1);
      if(k==null) return;
      g.forEach(i=>{ if(base[i].slots[k]) base[i].used.push(k); });
      changed=true;
    });
    if(!changed) break;
  }
  return base.map(b=>make(b,draft.cast.length>=2));
}
function handleOf(i){ const s=S(i); return ((s&&s.handle)||'').trim() || derivedHandles()[i]; }

/* ---- positions on the stage ---- x across the frame (0 left, 1 right),
   d depth (0 nearest the camera, 1 furthest). */
/* 2.1: seven horizontal bands (was five), so up to six figures in a row can
   each get distinct position words; presets snap to band centres. */
const HBANDS=[[1/7,'far_left','at the far left'],[2/7,'left','on the left'],[3/7,'left_of_centre','left of centre'],[4/7,'centre','at centre'],[5/7,'right_of_centre','right of centre'],[6/7,'right','on the right'],[1.01,'far_right','at the far right']];
const DBANDS=[[0.34,'front','in the foreground'],[0.67,'mid','in the midground'],[1.01,'back','in the background']];
function hband(x){ return HBANDS.find(b=>x<b[0])||HBANDS[6]; }
function dband(d){ return DBANDS.find(b=>d<b[0])||DBANDS[2]; }
function posOf(s){ return (s&&draft.staging.pos[s.id])||null; }
function posPhrase(p){ return p ? hband(p.x)[2]+', '+dband(p.d)[2] : ''; }
function phraseToPos(t){
  if(!t) return null; t=t.toLowerCase();
  const hs=[['far left',.071],['far right',.929],['left of centre',.357],['right of centre',.643],['on the left',.214],['on the right',.786],['centre',.5],['center',.5]];
  const ds=[['foreground',.17],['midground',.5],['background',.83]];
  const h=hs.find(x=>t.includes(x[0])), d=ds.find(x=>t.includes(x[0]));
  if(!h&&!d) return null;
  return {x:h?h[1]:.5,d:d?d[1]:.5};
}
function stagingPhrase(){
  const st=draft.staging;
  if(st.phrase&&st.phrase.trim()) return st.phrase.trim();
  const a=ARRANGEMENTS.find(x=>x.id===st.arr);
  return a&&a.phrase?a.phrase:'';
}
function relSentences(){
  const idx=id=>draft.cast.findIndex(s=>s.id===id);
  return draft.staging.rel.map(r=>{
    const a=idx(r.a), rel=(r.rel||'').trim();
    if(a<0||!rel) return '';
    const b=idx(r.b);
    return cap(handleOf(a)+' '+rel+(b>=0&&b!==a?' '+handleOf(b):''));
  }).filter(Boolean);
}
/* 2.2: figures are written in the order they stand: front to back, then left
   to right. Round 2: when the list order disagreed with the stated positions,
   the positions failed or the attributes split between the two (p01, p04, 0 of
   4 right); the same stage listed in stage order was right in 4 of 4 (p02, p05).
   Applies to the array and keyed shapes and to the headcount, only once every
   figure is placed. Classic keeps its order: figure 1 is the primary subject. */
function stageOrder(){
  const idx=draft.cast.map((s,i)=>i), sh=effShape();
  if(sh==='single'||sh==='classic'||!draft.cast.every(s=>posOf(s))) return idx;
  const di=i=>DBANDS.indexOf(dband(posOf(S(i)).d));
  return idx.slice().sort((a,b)=>(di(a)-di(b))||(posOf(S(a)).x-posOf(S(b)).x)||(a-b));
}
/* "stands behind" -> "standing behind"; "has an arm around" -> "with an arm around" */
function participle(rel){
  const m=rel.match(/^(\S+)(.*)$/); if(!m) return null;
  const w=m[1].toLowerCase(), rest=m[2];
  if(w==='has'||w==='have') return {ing:'with'+rest,key:rest.trim().split(/\s+/).slice(0,3).join(' ')};
  if(w==='is'||w==='are') return rest.trim()?{ing:rest.trim(),key:rest.trim().split(/\s+/)[0]}:null;
  if(/ing$/.test(w)) return {ing:rel,key:w};
  if(!/s$/.test(w)||/ss$/.test(w)) return null;
  let v;
  if(/ies$/.test(w)) v=w.slice(0,-3)+'y';
  else if(/(?:sh|ch|x|z|ss|o)es$/.test(w)) v=w.slice(0,-2);
  else v=w.slice(0,-1);
  let ing;
  if(v==='see') ing='seeing';
  else if(/[^e]e$/.test(v)) ing=v.slice(0,-1)+'ing';
  else if(/^[^aeiou]*[aeiou][bdgmnprt]$/.test(v)) ing=v+v.slice(-1)+'ing';
  else ing=v+'ing';
  return {ing:ing+rest,key:ing};
}
/* 2.2: each interaction is also written into the acting figure's own pose.
   Round 1: of two chained interactions, the one that lived only in the
   interaction row was dropped (d05). Round 2: with the clause in the pose, the
   two figures touched in 2 of 2 renders, against 1 of 3 without \u2014 though an
   arm around the shoulders came out as a hand on the near shoulder. A pose
   that already carries the action's verb is left alone. */
function mirrorClauses(i){
  if(castN()<2) return [];
  const id=S(i).id, body=sval(S(i),'pose_body').toLowerCase();
  return draft.staging.rel.filter(r=>r.a===id&&(r.rel||'').trim()).map(r=>{
    const p=participle(r.rel.trim()); if(!p||(p.key&&body.includes(p.key.toLowerCase()))) return '';
    const b=draft.cast.findIndex(s=>s.id===r.b);
    return p.ing+(b>=0&&b!==i?' '+handleOf(b):'');
  }).filter(Boolean);
}
function poseBodyOf(s,i){
  const body=sval(s,'pose_body');
  if(i==null||i<0) return body;
  return [body].concat(mirrorClauses(i)).filter(Boolean).join(', ');
}
function headcountLine(){
  const n=castN(); if(n<2||!draft.staging.headcount) return '';
  const hs=stageOrder().map(i=>handleOf(i));
  return 'the frame contains exactly '+NUMW[n]+' figures: '+hs.slice(0,-1).join(', ')+' and '+hs[n-1];
}
/* 2.1: when figures stand at different depths, the order is given per depth
   row ("foreground: A; background, left to right: B, C") — one flat order
   across rows says nothing about who is in front. */
function leftToRight(){
  const placed=draft.cast.map((s,i)=>({i,p:posOf(s)})).filter(o=>o.p);
  if(placed.length<2) return '';
  const rows=DBANDS.map(b=>({b,m:placed.filter(o=>dband(o.p.d)===b).sort((a,c)=>a.p.x-c.p.x)})).filter(r=>r.m.length);
  if(rows.length===1) return rows[0].m.map(o=>handleOf(o.i)).join(', ');
  return rows.map(r=>r.b[2].replace(/^in the /,'')+(r.m.length>1?', left to right: ':': ')+r.m.map(o=>handleOf(o.i)).join(', ')).join('; ');
}
function stagingEmits(){
  if(castN()<2) return false;
  return !!(draft.staging.headcount||stagingPhrase()||draft.cast.some(s=>posOf(s))||relSentences().length||listVals('stage_notes').length);
}
/* Output shape for the figures. 'classic' is subject + second_subject, the only
   multi-figure shape that has actually been rendered (examples 01 and 05), so
   it is the default for exactly two. Array and keyed-by-position are untested. */
function effShape(){
  const n=castN(); if(n<2) return 'single';
  const s=draft.outShape;
  if(s==='classic'&&n===2) return 'classic';
  if(s==='keyed') return 'keyed';
  if(s==='array') return 'array';
  return n===2?'classic':'array';
}
function figureKeys(){
  const raw=draft.cast.map((s,i)=>{ const p=posOf(s); return p?'figure_'+hband(p.x)[1]:'figure_'+(i+1); });
  let keys=raw.map((k,i)=>{ const p=posOf(S(i)); return (raw.filter(x=>x===k).length>1&&p)?k+'_'+dband(p.d)[1]:k; });
  const seen={};
  return keys.map(k=>{ seen[k]=(seen[k]||0)+1; return seen[k]>1?k+'_'+seen[k]:k; });
}
function fieldActive(f){ return !f.mode || f.mode===(draft.mode||'turbo'); }
function val(k){ return (draft.f[k]||'').trim(); }
function listVals(k){ return val(k).split('\n').map(x=>x.trim()).filter(Boolean); }
function chipVals(k){ return val(k).split('|').map(x=>x.trim()).filter(Boolean); }

/* ============================ derive: coverage ============================ */
/* With a panel grid, framing and pose belong in the cell descriptions, not in a
   global block \u2014 a global statement applies to all four cells and flattens the
   variation. So those two axes stop being required once panels carry them. */
function requiredAxes(){
  return (draft.enabled.panels && listVals('panel_list').length)
    ? AXES.filter(([id])=>id!=='composition'&&id!=='pose')
    : AXES;
}
function axisNA(id){
  return draft.enabled.panels && listVals('panel_list').length && (id==='composition'||id==='pose');
}
function coverage(){
  const hit=new Set();
  for(const s of SECTIONS){
    if(!secActive(s)||s.special==='cast') continue;
    for(const f of s.fields){
      if(!fieldActive(f)) continue;
      const ax=f.axis||s.axis; if(!ax) continue;
      if(val(f.k)) hit.add(ax);
    }
  }
  for(const sub of draft.cast) for(const g of SUBJ_GROUPS) for(const f of g.fields){
    const ax=f.axis||g.axis; if(ax&&sval(sub,f.k)) hit.add(ax);
  }
  return hit;
}

/* ============================ derive: JSON ============================
   Note the deliberate absence of any top-level administrative key
   ("Objective", "ResponseFormat", "prompt_type"). In the reference set, a
   prompt carrying those rendered them as garbled caption text across the top
   of the image — the model read a title block and drew one. */
/* A garment slot collapses to a plain string when there is only one layer —
   fewer keys for the model to reconcile in the common single-garment case —
   and expands to base/over/layering only when a second layer actually exists. */
function layerBlockS(s,bk,ok,hk){
  const b=sval(s,bk),o=sval(s,ok),h=sval(s,hk);
  if(!b&&!o&&!h) return null;
  if(b&&!o&&!h) return b;
  const x={};
  if(b) x.base_layer=b;
  if(o) x.over_layer=o;
  if(h) x.layering=h;
  return x;
}
function layerPhraseS(s,bk,ok,hk){
  const b=sval(s,bk),o=sval(s,ok),h=sval(s,hk);
  if(!b&&!o) return h;
  if(b&&o) return o+' over '+b+(h?' ('+h+')':'');
  return (o||b)+(h?' ('+h+')':'');
}

function buildNegative(){
  return (draft.mode||'turbo')==='turbo' ? '' : chipVals('neg').join(', ');
}

/* Identity block for one figure. `legacySecond` reproduces the 1.x
   second_subject key order and names exactly, so a migrated two-subject
   prompt emits byte-identical JSON. */
function subjCore(s,i,withWho,legacySecond){
  const o={};
  if(withWho) o.who=handleOf(i);
  const sm={subj_type:'type',subj_age:'age',subj_aesthetic:'aesthetic',subj_build:'build',subj_hair:'hair',subj_eyes:'eyes',subj_skin:'skin',subj_features:'distinguishing_features'};
  for(const k in sm) if(sval(s,k)) o[sm[k]]=sval(s,k);
  if(legacySecond){
    if(sval(s,'rstyle')) o.render_style=sval(s,'rstyle');
    if(sval(s,'scale')) o.scale_and_placement=sval(s,'scale');
    if(sval(s,'lock')) o.consistency_with_primary=sval(s,'lock');
    if(sval(s,'subj_expr')) o.expression=sval(s,'subj_expr');
  } else {
    if(sval(s,'subj_expr')) o.expression=sval(s,'subj_expr');
    if(sval(s,'rstyle')) o.render_style=sval(s,'rstyle');
    if(sval(s,'scale')) o.scale_and_placement=sval(s,'scale');
    if(sval(s,'lock')) o.consistency_with=sval(s,'lock');
  }
  return o;
}
function makeupObj(s){
  const mk={};
  if(sval(s,'makeup_style')) mk.style=sval(s,'makeup_style');
  const d=slist(s,'makeup_details'); if(d.length) mk.details=d;
  return Object.keys(mk).length?mk:null;
}
function wardObj(s){
  const w={};
  const up=layerBlockS(s,'ward_top_base','ward_top_over','ward_top_how'); if(up) w.upper=up;
  const lo=layerBlockS(s,'ward_bottom_base','ward_bottom_over','ward_bottom_how'); if(lo) w.lower=lo;
  if(sval(s,'ward_shoes')) w.footwear=sval(s,'ward_shoes');
  if(sval(s,'ward_outer')) w.outerwear=sval(s,'ward_outer');
  if(sval(s,'ward_acc')) w.accessories=sval(s,'ward_acc');
  return Object.keys(w).length?w:null;
}
function poseObj(s,i){
  const p={};
  const body=poseBodyOf(s,i); if(body) p.body=body;
  const pm={pose_hands:'hands',pose_gaze:'gaze'};
  for(const k in pm) if(sval(s,k)) p[pm[k]]=sval(s,k);
  return Object.keys(p).length?p:null;
}
/* A whole figure as one object. Makeup, wardrobe and pose sit inside the
   figure they belong to — finding #5: an attribute separated from its owner
   gets orphaned. */
function fullSubjObj(s,i,withWho,legacySecond){
  const o=subjCore(s,i,withWho,legacySecond);
  const mk=makeupObj(s); if(mk) o.makeup=mk;
  const w=wardObj(s); if(w) o.wardrobe=w;
  const p=poseObj(s,i); if(p) o.pose=p;
  const pp=posPhrase(posOf(s)); if(pp) o.position=pp;
  return o;
}

function buildJSON(){
  const o={};
  if(val('summary')) o.scene_summary=val('summary');
  const shape=effShape(), staged=stagingEmits(), turbo=(draft.mode||'turbo')==='turbo';

  if(shape==='single'||shape==='classic'){
    const p=P();
    const subj=subjCore(p,0,staged&&shape==='classic',false);
    if(shape==='classic'){ const pp=posPhrase(posOf(p)); if(pp) subj.position=pp; }
    if(Object.keys(subj).length) o.subject=subj;
    const mk=makeupObj(p); if(mk) o.makeup=mk;
    const w=wardObj(p); if(w) o.wardrobe=w;
    const po=poseObj(p,0); if(po) o.pose=po;
    if(shape==='classic'){
      const s2=fullSubjObj(S(1),1,staged,true);
      if(Object.keys(s2).length) o.second_subject=s2;
    }
  } else {
    const ord=stageOrder();
    if(shape==='array') o.subjects=ord.map(i=>fullSubjObj(S(i),i,staged,false));
    else { const keys=figureKeys(), m={}; ord.forEach(i=>{ m[keys[i]]=fullSubjObj(S(i),i,staged,false); }); o.figures=m; }
  }

  if(castN()>=2){
    if(val('style_sep')) o.style_separation=val('style_sep');
    const st={};
    /* On Turbo the headcount travels with the other assertions; on Standard
       (where additional_detail is not emitted) it stays in the staging block. */
    if(draft.staging.headcount&&!turbo) st.headcount=headcountLine();
    const ph=stagingPhrase(); if(ph) st.arrangement=ph;
    const lr=leftToRight(); if(lr) st.left_to_right=lr;
    const rs=relSentences(); if(rs.length) st.interactions=rs;
    const nt=listVals('stage_notes'); if(nt.length) st.notes=nt;
    if(Object.keys(st).length) o.staging=st;
  }

  const env={};
  if(val('loc')) env.location=val('loc');
  if(val('time')) env.time_of_day=val('time');
  if(val('bg_distance')) env.background_distance=val('bg_distance');
  if(listVals('bg_elements').length) env.elements=listVals('bg_elements');
  if(listVals('bg_fg').length) env.foreground=listVals('bg_fg');

/* flat variant: one level deep, dotted keys. An array of objects (the
   subjects array) is walked by index so the result stays one level deep. */
function buildFlat(){
